<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦔 小刺猬宠物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Inter', sans-serif;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body.standalone {
            background: radial-gradient(circle at 30% 20%, #1a1a2e 0%, #0a0a0f 70%);
        }

        /* ============================================================
           宠物容器 — 尺寸 = 图片尺寸，不再包含工具栏/气泡
           ============================================================ */
        .pet-wrapper {
            position: fixed;
            left: 0; top: 0;
            width: 120px; height: 120px;
            z-index: 99999;
            /* 初始藏在屏幕外，恢复位置后再出现 */
            transform: translate3d(-9999px, -9999px, 0);
            will-change: transform;
            cursor: grab;
            touch-action: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .pet-wrapper.ready { opacity: 1; }
        .pet-wrapper.dragging { cursor: grabbing; }
        .pet-wrapper.animating {
            transition:
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.4s ease;
        }

        /* ============================================================
           气泡 — 绝对定位，脱离文档流，不影响容器尺寸
           ============================================================ */
        .pet-bubble {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%) translateY(6px) scale(0.9);
            background: rgba(30, 30, 45, 0.94);
            color: #fff;
            padding: 8px 14px;
            border-radius: 14px 14px 4px 14px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 6px 20px rgba(0,0,0,0.28);
            max-width: 200px;
            min-height: 30px;
            opacity: 0;
            transition: all 0.26s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            z-index: 10;
        }
        .pet-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .pet-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px; right: 18px;
            width: 10px; height: 10px;
            background: rgba(30, 30, 45, 0.94);
            transform: rotate(45deg);
            border-right: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 0 0 2px 0;
        }
        /* 刺猬贴顶时，气泡翻到下方 */
        .pet-wrapper.bubble-below .pet-bubble {
            bottom: auto;
            top: calc(100% + 10px);
            border-radius: 4px 14px 14px 14px;
            transform: translateX(-50%) translateY(-6px) scale(0.9);
        }
        .pet-wrapper.bubble-below .pet-bubble.show {
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .pet-wrapper.bubble-below .pet-bubble::after {
            bottom: auto; top: -5px; right: 18px;
            border: none;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px 0 0 0;
        }

        /* ============================================================
           工具栏 — 绝对定位，脱离文档流
           ============================================================ */
        .pet-toolbar {
            position: absolute;
            left: 50%;
            top: calc(100% + 6px);
            transform: translateX(-50%) translateY(-6px);
            display: flex;
            gap: 2px;
            background: rgba(30, 30, 45, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 3px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            opacity: 0;
            transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 5;
        }
        .pet-wrapper.show-toolbar .pet-toolbar,
        .pet-wrapper:hover .pet-toolbar {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        /* 刺猬贴底时，工具栏翻到上方 */
        .pet-wrapper.toolbar-above .pet-toolbar {
            top: auto;
            bottom: calc(100% + 6px);
            transform: translateX(-50%) translateY(6px);
        }
        .pet-wrapper.toolbar-above.show-toolbar .pet-toolbar,
        .pet-wrapper.toolbar-above:hover .pet-toolbar {
            transform: translateX(-50%) translateY(0);
        }

        .toolbar-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.75);
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .toolbar-btn:hover {
            background: rgba(255,255,255,0.16);
            color: #fff;
            transform: scale(1.18);
        }
        .toolbar-btn:active { transform: scale(0.85); }

        /* ============================================================
           宠物身体
           ============================================================ */
        .pet-body {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.15s ease-out;
        }

        /* 呼吸浮动 */
        .pet-wrapper.idle-float .pet-body {
            animation: idleFloat 2.8s ease-in-out infinite;
        }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(-3px) rotate(-0.8deg); }
            75%      { transform: translateY(-3px) rotate(0.8deg); }
        }

        /* 光晕（跟随呼吸） */
        .pet-body::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(88,166,255,0.22) 0%, transparent 70%);
            animation: pulseGlow 3.2s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1);   opacity: 0.55; }
            50%      { transform: scale(1.1); opacity: 0.22; }
        }
        /* 睡觉时光晕偏冷色 */
        .pet-wrapper.sleeping .pet-body::before {
            background: radial-gradient(circle, rgba(120,160,255,0.28) 0%, transparent 70%);
        }

        /* 3D 倾斜层 */
        .pet-tilt {
            position: relative;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }

        .hedgehog-img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 14px rgba(0,0,0,0.22));
            pointer-events: none;
            transition: filter 0.2s ease-out;
        }
        /* 睡觉时图片变柔和 */
        .pet-wrapper.sleeping .hedgehog-img {
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15)) saturate(0.85) brightness(0.96);
        }

        /* 挤压动画 */
        .pet-wrapper.squash .hedgehog-img {
            animation: squashAnim 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes squashAnim {
            0%   { transform: scale(1, 1); }
            30%  { transform: scale(1.2, 0.8); }
            60%  { transform: scale(0.9, 1.13); }
            100% { transform: scale(1, 1); }
        }

        /* 旋转动画 */
        .pet-wrapper.spin .pet-body {
            animation: spinAnim 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        @keyframes spinAnim {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 睡觉摇摆 */
        .pet-wrapper.sleeping .pet-body {
            animation: sleepBreath 4.5s ease-in-out infinite;
        }
        @keyframes sleepBreath {
            0%, 100% { transform: scale(1) rotate(-1.2deg); }
            50%      { transform: scale(1.03) translateY(-2px) rotate(1.5deg); }
        }

        /* ============================================================
           💤 飘出
           ============================================================ */
        .sleep-zzz {
            position: absolute;
            top: -6px; right: -14px;
            font-size: 17px;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }
        .pet-wrapper.sleeping .sleep-zzz {
            animation: zzzFloat 2.6s ease-out infinite;
        }
        @keyframes zzzFloat {
            0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
            22%  { opacity: 1; transform: translate(-4px, -10px) scale(0.9); }
            65%  { opacity: 0.7; transform: translate(-16px, -32px) scale(1.1); }
            100% { opacity: 0; transform: translate(-26px, -54px) scale(1.25); }
        }

        /* ============================================================
           粒子层
           ============================================================ */
        .pet-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99998;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            pointer-events: none;
            will-change: transform, opacity;
            animation: particleFly 1.15s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        @keyframes particleFly {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            20%  { opacity: 1; }
            100% { opacity: 0; transform:
                    translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
                    scale(1.15) rotate(var(--rot)); }
        }

        /* ============================================================
           右键菜单
           ============================================================ */
        .pet-menu {
            position: fixed;
            background: rgba(28, 28, 42, 0.96);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
            z-index: 100000;
            display: none;
            min-width: 140px;
            animation: menuIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .pet-menu.show { display: block; }
        @keyframes menuIn {
            from { opacity: 0; transform: scale(0.9) translateY(-6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .pet-menu-item {
            padding: 7px 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.82);
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.14s;
            user-select: none;
        }
        .pet-menu-item:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .pet-menu-item.danger:hover {
            background: rgba(239,68,68,0.18);
            color: #f87171;
        }
        .pet-menu-sep {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 4px 8px;
        }

        /* 隐藏 */
        .pet-wrapper.hidden { display: none; }

        /* ============================================================
           移动端
           ============================================================ */
        @media (max-width: 600px) {
            .pet-wrapper { width: 88px; height: 88px; }
            .pet-bubble { font-size: 12px; padding: 6px 11px; max-width: 170px; }
            .toolbar-btn { width: 25px; height: 25px; font-size: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pet-body, .hedgehog-img, .pet-body::before,
            .pet-toolbar, .pet-bubble { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="pet-particles" id="petParticles"></div>

    <div class="pet-menu" id="petMenu">
        <div class="pet-menu-item" data-menu="love">❤️ 摸摸头</div>
        <div class="pet-menu-item" data-menu="food">🍎 喂食</div>
        <div class="pet-menu-item" data-menu="sleep">💤 哄睡</div>
        <div class="pet-menu-sep"></div>
        <div class="pet-menu-item" data-menu="spin">🔄 转圈圈</div>
        <div class="pet-menu-item" data-menu="roam">🚶 散散步</div>
        <div class="pet-menu-item" data-menu="reset">🏠 回角落</div>
        <div class="pet-menu-sep"></div>
        <div class="pet-menu-item danger" data-menu="hide">🙈 隐藏</div>
    </div>

    <div class="pet-wrapper" id="petWrapper">
        <div class="pet-bubble" id="petBubble"></div>

        <div class="pet-toolbar" id="petToolbar">
            <button class="toolbar-btn" data-action="love" title="摸摸头">❤️</button>
            <button class="toolbar-btn" data-action="food" title="喂食">🍎</button>
            <button class="toolbar-btn" data-action="sleep" title="哄睡">💤</button>
            <button class="toolbar-btn" data-action="spin" title="转圈">🔄</button>
            <button class="toolbar-btn" data-action="reset" title="归位">🏠</button>
        </div>

        <div class="pet-body" id="petBody">
            <div class="pet-tilt" id="petTilt">
                <img class="hedgehog-img" id="hedgehogImg" src="idle-1.png" alt="小刺猬">
            </div>
            <div class="sleep-zzz">💤</div>
        </div>
    </div>

<script>
(function () {
    'use strict';

    if (window.self === window.top) document.body.classList.add('standalone');

    // ============================================================
    // 配置
    // ============================================================
    const IMAGES = {
        idle1:     'idle-1.png',
        idle2:     'idle-2.png',
        blink:     'blink.png',
        surprised: 'surprised.png',
        happy:     'happy.png',
        angry:     'angry.png',
        sleep:     'sleep.png'
    };

    const MSG = {
        c1: ['你戳我干什么？', '干嘛呀～', '有事吗？'],
        c2: ['又戳？', '别闹～', '住手！'],
        c3: ['别戳了！', '再戳我就跑了！', '哼！'],
        c5: ['喂！我生气了！', '小心我咬你！', '💢'],
        c8: ['行吧你赢了……', '求你了放过我吧 🥺', '我认输……'],
        idle: [
            '今天天气不错～', '写代码好累啊', '有人在吗？',
            '我又饿了', '☕ 来杯咖啡', '记得按时吃饭',
            '熬夜对身体不好哦', '🦔 刺猬永不认输',
            '在想什么呢……', '要不要一起摸鱼？'
        ],
        pet:   ['嘿嘿～好开心！', '咕噜咕噜~', '再摸摸嘛～', '好舒服~'],
        food:  ['🍎 好吃！谢谢～', '吧唧吧唧…', '还要还要！'],
        sleep: ['晚安～', '好困……我先睡一会儿', '呼呼呼……'],
        wake:  ['唔……醒啦！', '谁呀…好困…', '呼啊——'],
        spin:  ['转圈圈～', '晕了晕了…', '🔄 看我表演！'],
        roam:  ['散散步～', '走走走～', '换个地方待会儿']
    };

    const KEYS = {
        pos:      'ciwei_pet_position',
        sleeping: 'ciwei_pet_sleeping',
        last:     'ciwei_pet_last_interaction',
        clicks:   'ciwei_pet_click_count',
        hidden:   'ciwei_pet_hidden'
    };

    // ============================================================
    // DOM
    // ============================================================
    const wrapper       = document.getElementById('petWrapper');
    const petBody       = document.getElementById('petBody');
    const petTilt       = document.getElementById('petTilt');
    const img           = document.getElementById('hedgehogImg');
    const bubble        = document.getElementById('petBubble');
    const toolbar       = document.getElementById('petToolbar');
    const particlesLayer= document.getElementById('petParticles');
    const menu          = document.getElementById('petMenu');

    // ============================================================
    // 状态
    // ============================================================
    const state = {
        x: 0, y: 0,
        sleeping: false,
        hidden: false,
        clicks: 0,
        last: Date.now(),
        face: 'idle1',
        dragging: false,
        moved: false,
        // 拖拽起始
        sClientX: 0, sClientY: 0,
        sPosX: 0, sPosY: 0,
        // 速度
        vx: 0, vy: 0,
        lastMoveX: 0, lastMoveY: 0, lastMoveTime: 0,
        // 定时器
        bubbleTimer: null,
        typeTimer: null,
        resetTimer: null,
        struggleTimer: null,
        idleActionTimer: null,
        zzzTimer: null,
        avoidTimer: null,
        avoidCooldown: 0,
        // 惯性
        sliding: false,
        // 视差
        tiltTimer: null
    };

    const SIZE = { desktop: 120, mobile: 88 };
    const S = () => window.matchMedia('(max-width: 600px)').matches ? SIZE.mobile : SIZE.desktop;
    const isMobile = () => window.matchMedia('(max-width: 600px)').matches;

    // ============================================================
    // 工具
    // ============================================================
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(v, b));
    const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

    // ============================================================
    // 位置控制（核心 — 用状态变量而非 getBoundingClientRect）
    // ============================================================
    function setPos(x, y, animate) {
        state.x = x;
        state.y = y;

        if (animate) {
            wrapper.classList.add('animating');
            setTimeout(() => wrapper.classList.remove('animating'), 600);
        }

        wrapper.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        updateFlip();
    }

    // 边界约束 — 关键：用 SIZE() 而非 DOM 尺寸
    function clampPos(x, y) {
        const s = S();
        return {
            x: clamp(x, 0, window.innerWidth  - s),
            y: clamp(y, 0, window.innerHeight - s)
        };
    }

    // 智能翻转
    function updateFlip() {
        const s = S();
        // 贴顶：气泡翻到下方
        if (state.y < 70) wrapper.classList.add('bubble-below');
        else               wrapper.classList.remove('bubble-below');

        // 贴底：工具栏翻到上方
        if (state.y + s + 70 > window.innerHeight) wrapper.classList.add('toolbar-above');
        else                                        wrapper.classList.remove('toolbar-above');
    }

    // ============================================================
    // 持久化
    // ============================================================
    function savePos() {
        lsSet(KEYS.pos, JSON.stringify({ x: Math.round(state.x), y: Math.round(state.y) }));
    }
    function saveLast() {
        state.last = Date.now();
        lsSet(KEYS.last, String(state.last));
    }
    function saveSleep() { lsSet(KEYS.sleeping, state.sleeping ? 'true' : 'false'); }
    function saveClicks() { lsSet(KEYS.clicks, String(state.clicks)); }
    function saveHidden() { lsSet(KEYS.hidden, state.hidden ? 'true' : 'false'); }

    // ============================================================
    // 图片
    // ============================================================
    function setImage(name) {
        if (!IMAGES[name]) return;
        state.face = name;
        img.src = IMAGES[name];
    }

    // ============================================================
    // 气泡（打字机效果）
    // ============================================================
    function showBubble(text, duration, typewriter) {
        duration = duration || 2600;
        typewriter = typewriter !== false;

        clearTimeout(state.bubbleTimer);
        clearInterval(state.typeTimer);

        bubble.classList.add('show');

        if (!typewriter) {
            bubble.textContent = text;
        } else {
            bubble.textContent = '';
            let i = 0;
            state.typeTimer = setInterval(() => {
                bubble.textContent += text[i++];
                if (i >= text.length) clearInterval(state.typeTimer);
            }, 32);
        }

        state.bubbleTimer = setTimeout(() => {
            bubble.classList.remove('show');
        }, duration + (typewriter ? text.length * 32 : 0));
    }

    // ============================================================
    // 粒子（带物理抛物线）
    // ============================================================
    function burst(emoji, count) {
        count = count || 4;
        const rect = petBody.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.textContent = emoji;

            const angle = rand(0, Math.PI * 2);
            const dist = rand(38, 78);

            p.style.left = cx + 'px';
            p.style.top  = cy + 'px';
            p.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(0) + 'px');
            p.style.setProperty('--dy', (Math.sin(angle) * dist - 26).toFixed(0) + 'px');
            p.style.setProperty('--rot', rand(-50, 50).toFixed(0) + 'deg');
            p.style.fontSize = rand(13, 21).toFixed(0) + 'px';
            p.style.animationDelay = rand(0, 0.14).toFixed(2) + 's';

            particlesLayer.appendChild(p);
            setTimeout(() => p.remove(), 1350);
        }
    }

    // ============================================================
    // 待机循环
    // ============================================================
    setInterval(() => {
        if (state.sleeping || state.hidden) return;
        if (state.face === 'idle1' || state.face === 'idle2') {
            setImage(state.face === 'idle1' ? 'idle2' : 'idle1');
        }
    }, 1000);

    (function blinkLoop() {
        setTimeout(() => {
            if (!state.sleeping && !state.hidden &&
                (state.face === 'idle1' || state.face === 'idle2')) {
                const prev = state.face;
                setImage('blink');
                setTimeout(() => {
                    if (state.face === 'blink') setImage(prev);
                }, 280);
            }
            blinkLoop();
        }, rand(3000, 7000));
    })();

    // ============================================================
    // 空闲小动作
    // ============================================================
    function scheduleIdleAction() {
        clearTimeout(state.idleActionTimer);
        state.idleActionTimer = setTimeout(() => {
            if (state.sleeping || state.hidden ||
                state.dragging ||
                Date.now() - state.last < 15000) {
                scheduleIdleAction();
                return;
            }

            const roll = Math.random();

            if (roll < 0.2) {
                // 张望
                setImage('surprised');
                setTimeout(() => {
                    if (!state.sleeping && state.face === 'surprised') setImage('idle1');
                }, 900);
            } else if (roll < 0.38) {
                // 吐泡泡
                burst('💭', 2);
            } else if (roll < 0.55) {
                // 说话
                showBubble(pick(MSG.idle));
            } else if (roll < 0.7) {
                // 小范围漫游
                roam(120, 200);
            } else if (roll < 0.82) {
                // 自动睡觉
                goSleep();
            }

            scheduleIdleAction();
        }, rand(22000, 48000));
    }

    // ============================================================
    // 睡觉
    // ============================================================
    function startZzz() {
        clearInterval(state.zzzTimer);
        state.zzzTimer = setInterval(() => {
            if (!state.sleeping || state.hidden) return;
            const r = petBody.getBoundingClientRect();
            const z = document.createElement('div');
            z.className = 'particle';
            z.textContent = '💤';
            z.style.left = (r.right - 8) + 'px';
            z.style.top  = (r.top - 4) + 'px';
            z.style.setProperty('--dx', rand(10, 28).toFixed(0) + 'px');
            z.style.setProperty('--dy', '-58px');
            z.style.setProperty('--rot', '0deg');
            z.style.fontSize = '14px';
            z.style.animationDuration = '2.1s';
            particlesLayer.appendChild(z);
            setTimeout(() => z.remove(), 2300);
        }, 2200);
    }

    function stopZzz() { clearInterval(state.zzzTimer); state.zzzTimer = null; }

    function goSleep() {
        if (state.sleeping) return;
        state.sleeping = true;
        saveSleep(); saveLast();
        wrapper.classList.add('sleeping');
        wrapper.classList.remove('idle-float');
        setImage('sleep');
        showBubble(pick(MSG.sleep), 2200, false);
        startZzz();
    }

    function wakeUp() {
        if (!state.sleeping) return;
        state.sleeping = false;
        saveSleep(); saveLast();
        wrapper.classList.remove('sleeping');
        wrapper.classList.add('idle-float');
        stopZzz();
        setImage('surprised');
        showBubble(pick(MSG.wake), 2000, false);
        burst('✨', 3);
        setTimeout(() => {
            if (!state.sleeping && state.face === 'surprised') setImage('idle1');
        }, 1200);
    }

    // ============================================================
    // 点击
    // ============================================================
    function handleClick() {
        saveLast();

        if (state.sleeping) { wakeUp(); return; }

        if (Date.now() - state.last > 5 * 60 * 1000) {
            state.clicks = 0;
        }

        state.clicks++;
        saveClicks();

        let msg = '', face = 'happy';
        const n = state.clicks;

        if (n === 1)      { msg = pick(MSG.c1); face = 'happy'; }
        else if (n === 2) { msg = pick(MSG.c2); face = 'happy'; }
        else if (n === 3) { msg = pick(MSG.c3); face = 'surprised'; }
        else if (n === 5) { msg = pick(MSG.c5); face = 'surprised'; }
        else if (n >= 8)  { msg = pick(MSG.c8); face = 'angry'; }
        else              { msg = pick(MSG.idle); face = 'happy'; }

        if (n > 15) msg = '你戳了 ' + n + ' 次了，累不累？';

        setImage(face);
        showBubble(msg);
        wrapper.classList.add('squash');
        setTimeout(() => wrapper.classList.remove('squash'), 440);

        burst(face === 'angry' ? '💢' : '✨', face === 'angry' ? 3 : 4);

        clearTimeout(state.resetTimer);
        state.resetTimer = setTimeout(() => {
            if (!state.sleeping) setImage('idle1');
            state.clicks = 0;
            saveClicks();
        }, 4000);

        if (isMobile()) {
            wrapper.classList.add('show-toolbar');
            setTimeout(() => wrapper.classList.remove('show-toolbar'), 2600);
        }
    }

    // ============================================================
    // 拖拽（含挣扎表情 + 惯性）
    // ============================================================
    function startStruggle() {
        clearInterval(state.struggleTimer);
        let toggle = false;
        state.struggleTimer = setInterval(() => {
            setImage(toggle ? 'surprised' : 'angry');
            toggle = !toggle;
        }, 260);
    }

    function stopStruggle() {
        clearInterval(state.struggleTimer);
        state.struggleTimer = null;
        if (!state.sleeping) setImage('idle1');
    }

    function onDown(e) {
        if (e.target.closest('.pet-toolbar') || e.target.closest('.pet-menu')) return;
        if (e.button && e.button !== 0) return;

        state.dragging = true;
        state.moved = false;
        wrapper.classList.add('dragging');
        wrapper.classList.remove('idle-float', 'animating');

        const p = e.touches ? e.touches[0] : e;
        state.sClientX = p.clientX;
        state.sClientY = p.clientY;
        state.sPosX = state.x;
        state.sPosY = state.y;

        state.vx = 0; state.vy = 0;
        state.lastMoveX = p.clientX;
        state.lastMoveY = p.clientY;
        state.lastMoveTime = Date.now();

        // 拖拽挣扎表情
        startStruggle();

        e.preventDefault();
    }

    function onMove(e) {
        if (!state.dragging) return;
        e.preventDefault();

        const p = e.touches ? e.touches[0] : e;
        const dx = p.clientX - state.sClientX;
        const dy = p.clientY - state.sClientY;

        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) state.moved = true;

        const c = clampPos(state.sPosX + dx, state.sPosY + dy);
        setPos(c.x, c.y, false);

        // 计算速度
        const now = Date.now();
        const dt = now - state.lastMoveTime;
        if (dt > 0) {
            state.vx = (p.clientX - state.lastMoveX) / dt * 16;
            state.vy = (p.clientY - state.lastMoveY) / dt * 16;
        }
        state.lastMoveX = p.clientX;
        state.lastMoveY = p.clientY;
        state.lastMoveTime = now;
    }

    function onUp(e) {
        if (!state.dragging) return;
        state.dragging = false;
        wrapper.classList.remove('dragging');
        wrapper.classList.add('idle-float');

        stopStruggle();

        if (!state.moved) {
            handleClick();
            return;
        }

        savePos();
        saveLast();

        // 惯性滑动
        slideInertia();
    }

    function slideInertia() {
        if (state.sliding) return;
        state.sliding = true;

        const friction = 0.93;
        const bounce = 0.55;

        function step() {
            state.vx *= friction;
            state.vy *= friction;

            if (Math.abs(state.vx) < 0.25 && Math.abs(state.vy) < 0.25) {
                state.sliding = false;
                const c = clampPos(state.x, state.y);
                setPos(c.x, c.y, false);
                savePos();
                return;
            }

            const s = S();
            let nx = state.x + state.vx;
            let ny = state.y + state.vy;

            let hit = false;

            if (nx < 0) { nx = 0; state.vx = -state.vx * bounce; hit = true; }
            if (ny < 0) { ny = 0; state.vy = -state.vy * bounce; hit = true; }
            if (nx > window.innerWidth  - s) { nx = window.innerWidth  - s; state.vx = -state.vx * bounce; hit = true; }
            if (ny > window.innerHeight - s) { ny = window.innerHeight - s; state.vy = -state.vy * bounce; hit = true; }

            if (hit) {
                // 撞墙挤压
                wrapper.classList.add('squash');
                setTimeout(() => wrapper.classList.remove('squash'), 320);
            }

            setPos(nx, ny, false);
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    wrapper.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);

    wrapper.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);

    img.addEventListener('dragstart', e => e.preventDefault());

    // 双击转圈
    let lastTap = 0;
    wrapper.addEventListener('click', function (e) {
        if (state.moved) return;
        const now = Date.now();
        if (now - lastTap < 300) {
            e.stopPropagation();
            doSpin();
            lastTap = 0;
        } else {
            lastTap = now;
        }
    });

    // ============================================================
    // 动作
    // ============================================================
    function doPet() {
        saveLast();
        if (state.sleeping) { wakeUp(); return; }
        setImage('happy');
        showBubble(pick(MSG.pet), 1800, false);
        burst('❤️', 5);
        setTimeout(() => {
            if (!state.sleeping && state.face === 'happy') setImage('idle1');
        }, 1600);
    }

    function doFood() {
        saveLast();
        if (state.sleeping) wakeUp();
        setImage('happy');
        showBubble(pick(MSG.food), 1800, false);
        burst('🍎', 4);
        setTimeout(() => {
            if (!state.sleeping && state.face === 'happy') setImage('idle1');
        }, 1800);
    }

    function doSleepToggle() {
        saveLast();
        if (state.sleeping) wakeUp(); else goSleep();
    }

    function doSpin() {
        saveLast();
        if (state.sleeping) wakeUp();
        wrapper.classList.add('spin');
        setImage('happy');
        showBubble(pick(MSG.spin), 1600, false);
        burst('💫', 5);
        setTimeout(() => wrapper.classList.remove('spin'), 850);
        setTimeout(() => { if (!state.sleeping) setImage('idle1'); }, 1500);
    }

    // 漫游（小范围随机移动）
    function roam(maxDistX, maxDistY) {
        if (state.sleeping || state.dragging) return;

        const s = S();
        const dirX = Math.random() < 0.5 ? -1 : 1;
        const dirY = Math.random() < 0.5 ? -1 : 1;
        const dx = dirX * rand(maxDistX * 0.4, maxDistX);
        const dy = dirY * rand(maxDistY * 0.4, maxDistY);

        const target = clampPos(state.x + dx, state.y + dy);

        if (Math.hypot(target.x - state.x, target.y - state.y) < 40) return;

        setPos(target.x, target.y, true);
        setTimeout(() => {
            if (!state.sleeping) savePos();
        }, 600);
    }

    function doRoam() {
        saveLast();
        if (state.sleeping) wakeUp();
        setImage('happy');
        showBubble(pick(MSG.roam), 1600, false);
        roam(150, 250);
        setTimeout(() => { if (!state.sleeping) setImage('idle1'); }, 1200);
    }

    function doReset() {
        saveLast();
        if (state.sleeping) wakeUp();

        const s = S();
        const tx = window.innerWidth  - s - 24;
        const ty = window.innerHeight - s - 24;

        setPos(tx, ty, true);
        showBubble('归位！', 1500, false);
        burst('🏠', 3);

        setTimeout(() => savePos(), 600);
    }

    function doHide() {
        state.hidden = true;
        saveHidden();
        wrapper.classList.add('hidden');
    }

    // ============================================================
    // 工具栏
    // ============================================================
    toolbar.addEventListener('click', function (e) {
        const btn = e.target.closest('.toolbar-btn');
        if (!btn) return;
        e.stopPropagation();
        const act = btn.dataset.action;
        if (act === 'love')       doPet();
        else if (act === 'food')  doFood();
        else if (act === 'sleep') doSleepToggle();
        else if (act === 'spin')  doSpin();
        else if (act === 'reset') doReset();
    });

    toolbar.addEventListener('mouseenter', () => wrapper.classList.add('show-toolbar'));
    toolbar.addEventListener('mouseleave', () => wrapper.classList.remove('show-toolbar'));

    // ============================================================
    // 右键菜单
    // ============================================================
    wrapper.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        if (isMobile()) return;

        menu.style.left = e.clientX + 'px';
        menu.style.top  = e.clientY + 'px';
        menu.classList.add('show');

        // 边界调整
        const mr = menu.getBoundingClientRect();
        if (mr.right  > window.innerWidth)  menu.style.left = (window.innerWidth  - mr.width  - 8) + 'px';
        if (mr.bottom > window.innerHeight) menu.style.top  = (window.innerHeight - mr.height - 8) + 'px';
    });

    menu.addEventListener('click', function (e) {
        const item = e.target.closest('[data-menu]');
        if (!item) return;
        const act = item.dataset.menu;
        menu.classList.remove('show');

        if (act === 'love')       doPet();
        else if (act === 'food')  doFood();
        else if (act === 'sleep') doSleepToggle();
        else if (act === 'spin')  doSpin();
        else if (act === 'roam')  doRoam();
        else if (act === 'reset') doReset();
        else if (act === 'hide')  doHide();
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.pet-menu') && !e.target.closest('#petWrapper')) {
            menu.classList.remove('show');
        }
    });

    // ============================================================
    // 视线跟随（3D 倾斜）
    // ============================================================
    document.addEventListener('mousemove', function (e) {
        if (isMobile() || state.dragging || state.hidden || state.sleeping) return;

        clearTimeout(state.tiltTimer);
        state.tiltTimer = setTimeout(() => {
            const s = S();
            const cx = state.x + s / 2;
            const cy = state.y + s / 2;

            const dx = (e.clientX - cx) / window.innerWidth;
            const dy = (e.clientY - cy) / window.innerHeight;

            const rx = clamp(dy * 14, -9, 9);
            const ry = clamp(-dx * 14, -9, 9);

            petTilt.style.transform = `perspective(500px) rotateX(${rx}deg) rotateY(${ry}deg)`;
        }, 20);
    });

    document.addEventListener('mouseleave', function () {
        petTilt.style.transform = '';
    });

    // 鼠标悬停时放大
    wrapper.addEventListener('mouseenter', function () {
        if (!isMobile() && !state.dragging && !state.sleeping && !state.hidden) {
            petTilt.style.transform = 'perspective(500px) scale(1.04)';
        }
    });
    wrapper.addEventListener('mouseleave', function () {
        if (!state.dragging) petTilt.style.transform = '';
    });

    // ============================================================
    // 智能避让（鼠标靠近时让开）
    // ============================================================
    document.addEventListener('mousemove', function (e) {
        if (isMobile() || state.dragging || state.sleeping || state.hidden) return;
        if (Date.now() < state.avoidCooldown) return;

        const s = S();
        const cx = state.x + s / 2;
        const cy = state.y + s / 2;
        const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

        if (dist < 85 && !state.avoidTimer) {
            state.avoidTimer = setTimeout(() => {
                if (state.dragging || state.sleeping) { state.avoidTimer = null; return; }

                // 远离鼠标方向移动
                const dx = cx - e.clientX;
                const dy = cy - e.clientY;
                const len = Math.hypot(dx, dy) || 1;
                const moveDist = 46;

                const tx = state.x + (dx / len) * moveDist;
                const ty = state.y + (dy / len) * moveDist;
                const c = clampPos(tx, ty);

                if (Math.hypot(c.x - state.x, c.y - state.y) > 15) {
                    setPos(c.x, c.y, true);
                    setTimeout(savePos, 600);
                }

                state.avoidCooldown = Date.now() + 8000;
                state.avoidTimer = null;
            }, 900);
        } else if (dist > 120) {
            clearTimeout(state.avoidTimer);
            state.avoidTimer = null;
        }
    });

    // ============================================================
    // 后台省电
    // ============================================================
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            savePos(); saveSleep(); saveClicks();
            lsSet(KEYS.last, String(state.last));
        }
    });

    // ============================================================
    // 恢复状态
    // ============================================================
    function restore() {
        // 位置
        let saved = null;
        try { saved = JSON.parse(lsGet(KEYS.pos) || 'null'); } catch (e) {}
        const s = S();

        if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
            const c = clampPos(saved.x, saved.y);
            setPos(c.x, c.y, false);
        } else {
            setPos(window.innerWidth - s - 24, window.innerHeight - s - 24, false);
        }

        // 睡觉
        if (lsGet(KEYS.sleeping) === 'true') {
            state.sleeping = true;
            wrapper.classList.add('sleeping');
            setImage('sleep');
            startZzz();
        } else {
            wrapper.classList.add('idle-float');
            setImage('idle1');
        }

        // 点击次数
        state.clicks = parseInt(lsGet(KEYS.clicks) || '0', 10) || 0;

        // 上次交互
        const last = parseInt(lsGet(KEYS.last) || '0', 10);
        if (last > 0) state.last = last;

        // 隐藏
        if (lsGet(KEYS.hidden) === 'true') {
            state.hidden = true;
            wrapper.classList.add('hidden');
        }
    }

    // 窗口变化
    let resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const c = clampPos(state.x, state.y);
            setPos(c.x, c.y, false);
            savePos();
        }, 150);
    });

    window.addEventListener('beforeunload', function () {
        savePos(); saveSleep(); saveClicks();
        lsSet(KEYS.last, String(state.last));
    });

    // ============================================================
    // 启动
    // ============================================================
    Object.values(IMAGES).forEach(src => { const i = new Image(); i.src = src; });

    restore();
    requestAnimationFrame(() => {
        wrapper.classList.add('ready');
    });

    scheduleIdleAction();

    setTimeout(() => {
        if (!state.sleeping && !state.hidden) {
            showBubble('你好呀～我是小刺猬 🦔', 2600, false);
            burst('✨', 4);
        }
    }, 1200);

    console.log('🦔 CiweiPet · 高级版已启动');
    console.log('✨ 特性：视线跟随 · 拖拽挣扎 · 惯性滑动 · 撞墙反弹 · 智能避让 · 自主漫游 · 双击转圈');
})();
</script>
</body>
</html>
