<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦔 小刺猬宠物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.standalone {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
        }

        /* ================================================================
           宠物主容器（可拖拽）
        ================================================================ */
        .pet-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: grab;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .pet-wrapper.dragging {
            cursor: grabbing;
            transition: none;
        }

        .pet-wrapper.dragging .hedgehog-img {
            transform: scale(1.08);
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.4));
        }

        /* ================================================================
           消息气泡
        ================================================================ */
        .pet-bubble {
            background: rgba(30, 30, 45, 0.95);
            color: #fff;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 220px;
            opacity: 0;
            transform: translateY(10px) scale(0.85);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            white-space: nowrap;
            z-index: 10;
        }

        .pet-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .pet-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 24px;
            width: 12px;
            height: 12px;
            background: rgba(30, 30, 45, 0.95);
            transform: rotate(45deg);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0 0 3px 0;
        }

        /* ================================================================
           宠物图片容器
        ================================================================ */
        .pet-body {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pet-body::before {
            content: '';
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.25) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.25;
            }
        }

        .hedgehog-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: idle-float 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.25));
            position: relative;
            z-index: 1;
            pointer-events: none;
            transition: transform 0.2s ease-out, filter 0.2s ease-out;
        }

        @keyframes idle-float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-4px) rotate(-1deg);
            }
            75% {
                transform: translateY(-4px) rotate(1deg);
            }
        }

        .pet-wrapper.clicked .hedgehog-img {
            animation: squash 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes squash {
            0% { transform: scale(1, 1); }
            30% { transform: scale(1.2, 0.8); }
            60% { transform: scale(0.9, 1.15); }
            100% { transform: scale(1, 1); }
        }

        /* 睡觉状态（慢速呼吸 + 轻微摇晃） */
        .pet-wrapper.sleeping .hedgehog-img {
            animation: sleep-breath 4s ease-in-out infinite;
        }

        @keyframes sleep-breath {
            0%, 100% { transform: scale(1) rotate(-1deg); }
            50% { transform: scale(1.04) translateY(-2px) rotate(1deg); }
        }

        /* ================================================================
           睡觉时飘出的 Zzz
        ================================================================ */
        .sleep-zzz {
            position: absolute;
            top: 0;
            right: -10px;
            font-size: 20px;
            font-weight: bold;
            color: rgba(88, 166, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 2px 8px rgba(88, 166, 255, 0.5);
            z-index: 2;
        }

        .pet-wrapper.sleeping .sleep-zzz {
            animation: zzz-float 3s ease-in-out infinite;
        }

        @keyframes zzz-float {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.6);
            }
            20% {
                opacity: 1;
                transform: translate(-5px, -10px) scale(0.9);
            }
            50% {
                opacity: 0.8;
                transform: translate(-12px, -25px) scale(1.1);
            }
            80% {
                opacity: 0.3;
                transform: translate(-18px, -40px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-25px, -55px) scale(1.3);
            }
        }

        /* ================================================================
           悬浮工具栏
        ================================================================ */
        .pet-toolbar {
            display: flex;
            gap: 4px;
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateX(-50%) translateY(8px);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            position: absolute;
            top: -44px;
            left: 50%;
        }

        .pet-wrapper:hover .pet-toolbar,
        .pet-wrapper.show-toolbar .pet-toolbar {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toolbar-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: scale(1.15);
        }

        .toolbar-btn:active {
            transform: scale(0.9);
        }

        /* ================================================================
           粒子特效层
        ================================================================ */
        .pet-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99998;
        }

        .particle {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: particleFly 1.2s ease-out forwards;
            will-change: transform, opacity;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot));
            }
        }

        /* ================================================================
           移动端适配
        ================================================================ */
        @media (max-width: 600px) {
            .pet-wrapper {
                bottom: 16px;
                right: 16px;
            }
            .pet-body {
                width: 90px;
                height: 90px;
            }
            .pet-bubble {
                font-size: 13px;
                padding: 8px 14px;
                max-width: 180px;
            }
            .pet-toolbar {
                top: -40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hedgehog-img,
            .pet-body::before {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 粒子层 ===== -->
    <div class="pet-particles" id="petParticles"></div>

    <!-- ===== 宠物容器 ===== -->
    <div class="pet-wrapper" id="petWrapper">
        <!-- 气泡 -->
        <div class="pet-bubble" id="petBubble"></div>

        <!-- 悬浮工具栏 -->
        <div class="pet-toolbar" id="petToolbar">
            <button class="toolbar-btn" data-action="love" title="摸摸头">❤️</button>
            <button class="toolbar-btn" data-action="food" title="喂食">🍎</button>
            <button class="toolbar-btn" data-action="sleep" title="哄睡">💤</button>
            <button class="toolbar-btn" data-action="reset" title="归位">🏠</button>
        </div>

        <!-- 宠物本体 -->
        <div class="pet-body" id="petBody">
            <img class="hedgehog-img" id="hedgehogImg" src="idle-1.png" alt="小刺猬">
            <!-- 睡觉时飘出的 Zzz -->
            <div class="sleep-zzz">💤</div>
        </div>
    </div>

    <script>
        // ================================================================
        // 检测是否独立打开（非 iframe 嵌入）
        // ================================================================
        if (window.self === window.top) {
            document.body.classList.add('standalone');
        }

        // ================================================================
        // 配置：图片全在根目录
        // ================================================================
        const IMAGES = {
            idle1: 'idle-1.png',
            idle2: 'idle-2.png',
            blink: 'blink.png',
            surprised: 'surprised.png',
            happy: 'happy.png',
            angry: 'angry.png',
            sleep: 'sleep.png'
        };

        // 点击次数对应的消息
        const CLICK_MESSAGES = {
            1: '你戳我干什么？',
            3: '别戳了！',
            5: '再戳我就跑了！',
            8: '喂！我生气了！',
            10: '行吧你赢了……',
            15: '求你了放过我吧 🥺'
        };

        // 其他次数的随机消息
        const RANDOM_MESSAGES = [
            '干嘛呀～', '有事吗？', '我在忙……', '嗯？', '别闹～',
            '你戳到我的刺了！', '哈哈，痒！', '住手！', '小心我咬你！',
            '我在睡觉呢……', '呼噜呼噜……', '咦？你是谁呀？',
            '👀', '唔……', '又来了……', '好无聊啊', '摸摸头？'
        ];

        // 空闲时随机说的话
        const IDLE_MESSAGES = [
            '今天天气不错～', '写代码好累啊', '有人在吗？',
            '我又饿了', '☕ 来杯咖啡', '你的博客真好看',
            '记得按时吃饭', '熬夜对身体不好哦', '好困……',
            '🦔 刺猬永不认输', '要不要一起摸鱼？'
        ];

        // 睡觉时说的话
        const SLEEP_MESSAGES = [
            '呼呼呼……', 'Zzz……', '别吵……我在做梦……',
            '梦里也有小鱼干'
        ];

        // ================================================================
        // DOM 引用
        // ================================================================
        const wrapper = document.getElementById('petWrapper');
        const petBody = document.getElementById('petBody');
        const img = document.getElementById('hedgehogImg');
        const bubble = document.getElementById('petBubble');
        const toolbar = document.getElementById('petToolbar');
        const particlesLayer = document.getElementById('petParticles');

        // ================================================================
        // 状态
        // ================================================================
        let clickCount = 0;
        let currentState = 'idle1';
        let isSleeping = false;
        let lastInteraction = Date.now();
        let bubbleTimer = null;
        let resetTimer = null;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let wrapperStartX = 0;
        let wrapperStartY = 0;
        let hasMoved = false;

        const POSITION_KEY = 'ciwei_pet_position';

        // ================================================================
        // 预加载图片
        // ================================================================
        function preloadImages() {
            Object.values(IMAGES).forEach(src => {
                const image = new Image();
                image.src = src;
            });
        }

        // ================================================================
        // 图片切换
        // ================================================================
        function setImage(stateName) {
            if (!IMAGES[stateName]) return;
            currentState = stateName;
            img.src = IMAGES[stateName];
        }

        // ================================================================
        // 气泡
        // ================================================================
        function showBubble(message, duration = 3000) {
            bubble.textContent = message;
            bubble.classList.add('show');
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => {
                bubble.classList.remove('show');
            }, duration);
        }

        function randomMessage(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // ================================================================
        // 粒子特效
        // ================================================================
        function createParticles(emoji, count = 5) {
            const rect = petBody.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emoji;
                particle.style.left = (centerX - 10) + 'px';
                particle.style.top = (centerY - 10) + 'px';

                const angle = (Math.random() * 360) * Math.PI / 180;
                const distance = 40 + Math.random() * 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                const rot = (Math.random() - 0.5) * 90;

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                particle.style.setProperty('--rot', rot + 'deg');
                particle.style.animationDelay = (Math.random() * 0.15) + 's';

                particlesLayer.appendChild(particle);
                setTimeout(() => particle.remove(), 1500);
            }
        }

        // ================================================================
        // 待机呼吸动画
        // ================================================================
        setInterval(() => {
            if (isSleeping) return;
            if (currentState === 'idle1' || currentState === 'idle2') {
                setImage(currentState === 'idle1' ? 'idle2' : 'idle1');
            }
        }, 1000);

        // ================================================================
        // 随机眨眼
        // ================================================================
        function scheduleBlink() {
            const delay = 3000 + Math.random() * 5000;
            setTimeout(() => {
                if (!isSleeping && (currentState === 'idle1' || currentState === 'idle2')) {
                    const prevState = currentState;
                    setImage('blink');
                    setTimeout(() => {
                        if (currentState === 'blink') {
                            setImage(prevState);
                        }
                    }, 300);
                }
                scheduleBlink();
            }, delay);
        }
        scheduleBlink();

        // ================================================================
        // 点击处理
        // ================================================================
        function handleClick() {
            if (isDragging) return;

            lastInteraction = Date.now();

            // 睡觉时点击唤醒
            if (isSleeping) {
                isSleeping = false;
                wrapper.classList.remove('sleeping');
                setImage('idle1');
                showBubble('唔……醒啦！');
                createParticles('✨', 4);
                return;
            }

            clickCount++;

            let message = '';
            let newImg = 'happy';

            if (CLICK_MESSAGES[clickCount]) {
                message = CLICK_MESSAGES[clickCount];
            } else if (clickCount > 15) {
                message = `你戳了 ${clickCount} 次了，累不累？`;
            } else {
                message = randomMessage(RANDOM_MESSAGES);
            }

            if (clickCount >= 8) {
                newImg = 'angry';
            } else if (clickCount >= 3) {
                newImg = 'surprised';
            } else {
                newImg = 'happy';
            }

            setImage(newImg);
            showBubble(message);
            wrapper.classList.add('clicked');

            if (clickCount >= 8) {
                createParticles('💢', 3);
            } else {
                createParticles('✨', 3);
            }

            setTimeout(() => {
                wrapper.classList.remove('clicked');
            }, 400);

            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                if (!isSleeping) {
                    setImage('idle1');
                }
                clickCount = 0;
            }, 1500);
        }

        // ================================================================
        // 拖拽
        // ================================================================
        function handleDragStart(e) {
            if (e.target.closest('.pet-toolbar')) return;

            isDragging = true;
            hasMoved = false;
            wrapper.classList.add('dragging');

            const point = e.touches ? e.touches[0] : e;
            dragStartX = point.clientX;
            dragStartY = point.clientY;

            const rect = wrapper.getBoundingClientRect();
            wrapperStartX = rect.left;
            wrapperStartY = rect.top;

            wrapper.style.left = wrapperStartX + 'px';
            wrapper.style.top = wrapperStartY + 'px';
            wrapper.style.right = 'auto';
            wrapper.style.bottom = 'auto';
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            e.preventDefault();

            const point = e.touches ? e.touches[0] : e;
            const dx = point.clientX - dragStartX;
            const dy = point.clientY - dragStartY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }

            wrapper.style.left = (wrapperStartX + dx) + 'px';
            wrapper.style.top = (wrapperStartY + dy) + 'px';
        }

        function handleDragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            wrapper.classList.remove('dragging');

            if (!hasMoved) {
                handleClick();
                return;
            }

            const rect = wrapper.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width;
            const maxY = window.innerHeight - rect.height;
            let finalX = Math.max(0, Math.min(rect.left, maxX));
            let finalY = Math.max(0, Math.min(rect.top, maxY));

            wrapper.style.left = finalX + 'px';
            wrapper.style.top = finalY + 'px';

            try {
                localStorage.setItem(POSITION_KEY, JSON.stringify({
                    x: finalX,
                    y: finalY,
                    isLeftTop: true
                }));
            } catch (err) {}
        }

        wrapper.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);

        wrapper.addEventListener('touchstart', handleDragStart, { passive: true });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

        img.addEventListener('dragstart', e => e.preventDefault());

        // ================================================================
        // 工具栏
        // ================================================================
        toolbar.addEventListener('click', function(e) {
            const btn = e.target.closest('.toolbar-btn');
            if (!btn) return;
            e.stopPropagation();

            const action = btn.dataset.action;
            lastInteraction = Date.now();

            switch (action) {
                case 'love':
                    setImage('happy');
                    showBubble('嘿嘿～好开心！');
                    createParticles('❤️', 6);
                    setTimeout(() => {
                        if (!isSleeping) setImage('idle1');
                    }, 1500);
                    break;

                case 'food':
                    setImage('happy');
                    showBubble('🍎 好吃！谢谢～');
                    createParticles('🍎', 4);
                    setTimeout(() => {
                        if (!isSleeping) setImage('idle1');
                    }, 1500);
                    break;

                case 'sleep':
                    if (isSleeping) {
                        // 唤醒
                        isSleeping = false;
                        wrapper.classList.remove('sleeping');
                        setImage('idle1');
                        showBubble('睡醒啦！');
                        createParticles('✨', 4);
                    } else {
                        // 哄睡
                        isSleeping = true;
                        wrapper.classList.add('sleeping');
                        setImage('sleep');
                        showBubble('晚安～');
                        createParticles('💤', 3);
                    }
                    break;

                case 'reset':
                    wrapper.style.left = '';
                    wrapper.style.top = '';
                    wrapper.style.right = '24px';
                    wrapper.style.bottom = '24px';
                    try {
                        localStorage.removeItem(POSITION_KEY);
                    } catch (err) {}
                    showBubble('归位！');
                    break;
            }
        });

        // ================================================================
        // 空闲说话
        // ================================================================
        function scheduleIdleTalk() {
            const delay = 30000 + Math.random() * 30000;
            setTimeout(() => {
                if (Date.now() - lastInteraction > 20000 && !isSleeping) {
                    if (Math.random() < 0.3) {
                        // 自动睡觉
                        isSleeping = true;
                        wrapper.classList.add('sleeping');
                        setImage('sleep');
                        showBubble('好困……我先睡一会儿');
                        createParticles('💤', 3);
                    } else {
                        showBubble(randomMessage(IDLE_MESSAGES));
                    }
                }
                scheduleIdleTalk();
            }, delay);
        }
        scheduleIdleTalk();

        // 睡觉时偶尔说梦话
        setInterval(() => {
            if (isSleeping && Math.random() < 0.3) {
                showBubble(randomMessage(SLEEP_MESSAGES));
            }
        }, 15000);

        // ================================================================
        // 恢复位置
        // ================================================================
        function restorePosition() {
            try {
                const saved = localStorage.getItem(POSITION_KEY);
                if (saved) {
                    const pos = JSON.parse(saved);
                    if (pos.isLeftTop) {
                        wrapper.style.left = pos.x + 'px';
                        wrapper.style.top = pos.y + 'px';
                        wrapper.style.right = 'auto';
                        wrapper.style.bottom = 'auto';
                    }
                }
            } catch (err) {}
        }

        // 窗口大小改变时调整位置
        window.addEventListener('resize', function() {
            const rect = wrapper.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width;
            const maxY = window.innerHeight - rect.height;
            if (rect.left > maxX) {
                wrapper.style.left = maxX + 'px';
            }
            if (rect.top > maxY) {
                wrapper.style.top = maxY + 'px';
            }
        });

        // ================================================================
        // 启动
        // ================================================================
        preloadImages();
        restorePosition();

        setTimeout(() => {
            showBubble('你好呀～我是小刺猬');
            createParticles('✨', 4);
        }, 1500);

        console.log('🦔 小刺猬宠物已启动（含睡觉模式）');
    </script>

</body>
</html>
