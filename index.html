<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦔 小c · 电子宠物</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58a6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小c">
<style>
:root {
    --cp-size: 120px;
    --cp-accent: 88, 166, 255;
    --cp-breath: 2.8s;
    --cp-glow: 3.2s;
    --cp-tilt: .5s;
    --cp-bubble: .26s;
    --cp-particle: 1.15s;
    --cp-zzz: 2.6s;
    /* 浅色模式默认变量 */
    --bg-body: #f0f2f5;
    --text-main: #1a1a2e;
    --text-sub: #555;
    --panel-bg: rgba(255, 255, 255, 0.92);
    --panel-border: rgba(0, 0, 0, 0.08);
    --item-hover: rgba(0, 0, 0, 0.05);
    --bubble-bg: rgba(255, 255, 255, 0.95);
    --bubble-text: #1a1a2e;
    --input-bg: rgba(0, 0, 0, 0.05);
}

/* 深色模式自动跟随系统 */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-body: #0a0a0f;
        --text-main: #e0e8f5;
        --text-sub: #888;
        --panel-bg: rgba(28, 28, 42, 0.97);
        --panel-border: rgba(255, 255, 255, 0.1);
        --item-hover: rgba(255, 255, 255, 0.1);
        --bubble-bg: rgba(30, 30, 45, 0.94);
        --bubble-text: #fff;
        --input-bg: rgba(255, 255, 255, 0.08);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-body);
    font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Inter', sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: var(--text-main);
}

@media (max-width: 600px) { :root { --cp-size: 88px; } }

body[data-fps="high"] { --cp-breath: 2.5s; --cp-glow: 3s; --cp-tilt: .42s; }
body[data-fps="low"] { --cp-breath: 3.4s; --cp-glow: 3.8s; --cp-tilt: .6s; --cp-particle: 1.35s; }

/* ==================== 宠物容器 ==================== */
#ciwei-pet {
    position: fixed; left: 0; top: 0;
    width: var(--cp-size); height: var(--cp-size);
    z-index: 99999;
    transform: translate3d(-9999px, -9999px, 0);
    will-change: transform;
    cursor: grab; touch-action: none;
    opacity: 0;
    transition: opacity .45s cubic-bezier(.22,1,.36,1), width .35s cubic-bezier(.34,1.56,.64,1), height .35s cubic-bezier(.34,1.56,.64,1);
}
#ciwei-pet.ready { opacity: 1; }
#ciwei-pet.dragging { cursor: grabbing; }
#ciwei-pet.animating { transition: transform .55s cubic-bezier(.34,1.56,.64,1), opacity .45s, width .35s, height .35s; }
#ciwei-pet.scaling { transition: none; }
#ciwei-pet.hidden { display: none; }

#ciwei-pet .cp-body { position: relative; width: 100%; height: 100%; transition: transform .15s ease-out; transform-style: preserve-3d; }
#ciwei-pet.idle-float .cp-body { animation: cp-idleFloat var(--cp-breath) ease-in-out infinite; }
@keyframes cp-idleFloat {
    0%, 100% { transform: translateY(0) rotate(0); }
    25%      { transform: translateY(-3px) rotate(-.8deg); }
    75%      { transform: translateY(-3px) rotate(.8deg); }
}
#ciwei-pet .cp-shadow {
    position: absolute; bottom: -6px; left: 50%;
    transform: translateX(-50%); width: 66%; height: 9px;
    background: radial-gradient(ellipse, rgba(0,0,0,.32) 0%, transparent 72%);
    border-radius: 50%; pointer-events: none; z-index: -1;
    transition: all .28s cubic-bezier(.22,1,.36,1);
}
#ciwei-pet.dragging .cp-shadow { opacity: .12; transform: translateX(-50%) scale(1.4); bottom: -14px; }
#ciwei-pet.sleeping .cp-shadow { width: 76%; opacity: .5; }

#ciwei-pet .cp-tilt {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--cp-tilt) cubic-bezier(.22,1,.36,1);
    z-index: 1;
}
#ciwei-pet .cp-light {
    position: absolute; inset: -18px; border-radius: 50%;
    pointer-events: none; z-index: 2;
    background: radial-gradient(circle at var(--cp-light-x, 50%) var(--cp-light-y, 50%), rgba(255,255,255,.36) 0%, transparent 55%);
    mix-blend-mode: overlay; opacity: .7; transition: opacity .3s;
}
#ciwei-pet.sleeping .cp-light { opacity: .25; }

#ciwei-pet .cp-img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 5px 14px rgba(0,0,0,.22));
    pointer-events: none; transition: filter .22s ease-out;
    -webkit-user-drag: none;
}
#ciwei-pet.sleeping .cp-img { filter: drop-shadow(0 4px 10px rgba(0,0,0,.14)) saturate(.85) brightness(.96); }

#ciwei-pet.squash .cp-img { animation: cp-squash .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes cp-squash { 0% { transform: scale(1, 1); } 30% { transform: scale(1.2, .8); } 60% { transform: scale(.9, 1.13); } 100% { transform: scale(1, 1); } }

#ciwei-pet.spin .cp-tilt { animation: cp-spin .85s cubic-bezier(.34,1.56,.64,1); }
@keyframes cp-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }

#ciwei-pet.sleeping .cp-body { animation: cp-sleepBreath 4.5s ease-in-out infinite; }
@keyframes cp-sleepBreath { 0%, 100% { transform: scale(1) rotate(-1.2deg); } 50% { transform: scale(1.03) translateY(-2px) rotate(1.5deg); } }

#ciwei-pet .cp-zzz { position: absolute; top: -6px; right: -14px; font-size: 17px; opacity: 0; pointer-events: none; z-index: 2; }
#ciwei-pet.sleeping .cp-zzz { animation: cp-zzzFloat var(--cp-zzz) ease-out infinite; }
@keyframes cp-zzzFloat { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 22% { opacity: 1; transform: translate(-4px, -10px) scale(.9); } 65% { opacity: .7; transform: translate(-16px, -32px) scale(1.1); } 100% { opacity: 0; transform: translate(-26px, -54px) scale(1.25); } }

/* ==================== 气泡 ==================== */
#ciwei-pet .cp-bubble {
    position: absolute; left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(6px) scale(.9);
    background: var(--bubble-bg); color: var(--bubble-text);
    padding: 8px 14px; border-radius: 14px 14px 4px 14px;
    font-size: 13px; font-weight: 500; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    width: max-content; max-width: 280px; min-width: 60px;
    white-space: nowrap; word-break: normal; text-align: left;
    opacity: 0; transition: all var(--cp-bubble) cubic-bezier(.22,1,.36,1);
    pointer-events: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); z-index: 10;
}
#ciwei-pet .cp-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
#ciwei-pet .cp-bubble.long { white-space: normal; word-break: break-word; }
#ciwei-pet .cp-bubble::after {
    content: ''; position: absolute; bottom: -5px; right: 18px; width: 10px; height: 10px;
    background: var(--bubble-bg); transform: rotate(45deg);
    border-right: 1px solid var(--panel-border); border-bottom: 1px solid var(--panel-border);
    border-radius: 0 0 2px 0;
}
#ciwei-pet.bubble-below .cp-bubble { bottom: auto; top: calc(100% + 10px); border-radius: 4px 14px 14px 14px; transform: translateX(-50%) translateY(-6px) scale(.9); }
#ciwei-pet.bubble-below .cp-bubble.show { transform: translateX(-50%) translateY(0) scale(1); }
#ciwei-pet.bubble-below .cp-bubble::after { bottom: auto; top: -5px; right: 18px; border: none; border-left: 1px solid var(--panel-border); border-top: 1px solid var(--panel-border); border-radius: 2px 0 0 0; }

/* ==================== 工具栏 ==================== */
#ciwei-pet .cp-toolbar {
    position: absolute; left: 50%; top: calc(100% + 6px);
    transform: translateX(-50%) translateY(-6px);
    display: flex; gap: 2px; background: var(--panel-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 3px; border-radius: 18px; border: 1px solid var(--panel-border);
    box-shadow: 0 6px 18px rgba(0,0,0,.12); opacity: 0;
    transition: all .24s cubic-bezier(.22,1,.36,1); pointer-events: none; z-index: 5;
}
#ciwei-pet.show-toolbar .cp-toolbar, #ciwei-pet:hover .cp-toolbar { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#ciwei-pet.toolbar-above .cp-toolbar { top: auto; bottom: calc(100% + 6px); transform: translateX(-50%) translateY(6px); }
#ciwei-pet.toolbar-above.show-toolbar .cp-toolbar, #ciwei-pet.toolbar-above:hover .cp-toolbar { transform: translateX(-50%) translateY(0); }
#ciwei-pet .cp-toolbar-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent;
    color: var(--text-main); opacity: .7; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; transition: all .18s;
}
#ciwei-pet .cp-toolbar-btn:hover { background: var(--item-hover); opacity: 1; transform: scale(1.18); }
#ciwei-pet .cp-toolbar-btn:active { transform: scale(.85); }

/* ==================== 粒子 ==================== */
#ciwei-pet-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99998; overflow: hidden; }
#ciwei-pet-particles .cp-particle { position: absolute; pointer-events: none; will-change: transform, opacity; animation: cp-particleFly 1.15s cubic-bezier(.22,.61,.36,1) forwards; }
@keyframes cp-particleFly { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot)); } }

/* ==================== 主菜单/二级菜单/对话框/设置面板 ==================== */
#ciwei-pet-menu, #ciwei-pet-submenu, #ciwei-pet-dialogue, #ciwei-pet-settings {
    position: fixed; background: var(--panel-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--panel-border); border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0,0,0,.15); z-index: 100000; display: none;
    font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Inter', sans-serif;
    color: var(--text-main); animation: cp-menuIn .18s cubic-bezier(.22,1,.36,1);
    transform-origin: top left;
}
@keyframes cp-menuIn { from { opacity: 0; transform: scale(.9) translateY(-6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
#ciwei-pet-menu.show { display: flex; gap: 2px; padding: 5px; }
#ciwei-pet-submenu.show, #ciwei-pet-dialogue.show, #ciwei-pet-settings.show { display: block; }

#ciwei-pet-menu .cp-mi { position: relative; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; transition: all .15s; }
#ciwei-pet-menu .cp-mi:hover { background: var(--item-hover); transform: translateY(-2px); }
#ciwei-pet-menu .cp-mi:active { transform: translateY(0) scale(.92); }
#ciwei-pet-menu .cp-mi::after {
    content: attr(data-label); position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) translateY(-4px); font-size: 11px; color: var(--bubble-text);
    background: var(--panel-bg); padding: 3px 8px; border-radius: 6px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: all .18s; z-index: 1; border: 1px solid var(--panel-border);
}
#ciwei-pet-menu .cp-mi:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

#ciwei-pet-submenu { padding: 5px; min-width: 170px; }
#ciwei-pet-submenu .cp-sub-item { padding: 8px 12px; font-size: 13px; color: var(--text-sub); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .14s; white-space: nowrap; }
#ciwei-pet-submenu .cp-sub-item:hover { background: var(--item-hover); color: var(--text-main); }
#ciwei-pet-submenu .cp-sub-item:active { transform: scale(.98); }
#ciwei-pet-submenu .cp-sub-item .cp-sub-check { margin-left: auto; font-size: 11px; color: var(--text-sub); }
#ciwei-pet-submenu .cp-sep { height: 1px; background: var(--panel-border); margin: 4px 8px; }

#ciwei-pet-dialogue { min-width: 220px; max-width: 280px; max-height: 60vh; overflow-y: auto; overflow-x: hidden; padding: 6px; }
#ciwei-pet-dialogue::-webkit-scrollbar { width: 3px; }
#ciwei-pet-dialogue::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
#ciwei-pet-dialogue .cp-dlg-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 8px; border-bottom: 1px solid var(--panel-border); margin-bottom: 4px; position: sticky; top: 0; background: var(--panel-bg); border-radius: 14px 14px 0 0; z-index: 1; }
#ciwei-pet-dialogue .cp-dlg-title { font-size: 12px; font-weight: 600; color: var(--text-sub); letter-spacing: .5px; }
#ciwei-pet-dialogue .cp-dlg-close { background: none; border: none; color: var(--text-sub); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
#ciwei-pet-dialogue .cp-dlg-close:hover { background: var(--item-hover); color: var(--text-main); }
#ciwei-pet-dialogue .cp-dlg-item { padding: 9px 12px; font-size: 13px; color: var(--text-main); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative; }
#ciwei-pet-dialogue .cp-dlg-item:hover { background: var(--item-hover); }
#ciwei-pet-dialogue .cp-dlg-item:active { background: var(--item-hover); transform: scale(.98); }
#ciwei-pet-dialogue .cp-dlg-item .cp-dlg-icon { font-size: 13px; flex-shrink: 0; opacity: .6; }
#ciwei-pet-dialogue .cp-dlg-item.asked { color: var(--text-sub); opacity: .6; }
#ciwei-pet-dialogue .cp-dlg-item.asked::after { content: '✓'; position: absolute; right: 10px; font-size: 11px; color: #58a6ff; }
#ciwei-pet-dialogue .cp-dlg-item.secret { color: #fbbf24; }
#ciwei-pet-dialogue .cp-dlg-item.replying { background: rgba(88,166,255,.15); color: var(--text-main); }
#ciwei-pet-dialogue .cp-dlg-item.replying::after { content: '…'; position: absolute; right: 10px; color: #58a6ff; animation: cp-dots 1.2s steps(4) infinite; }
@keyframes cp-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

/* 聊天输入区 */
.cp-input-area { padding: 6px; border-top: 1px solid var(--panel-border); display: flex; gap: 6px; align-items: center; position: sticky; bottom: 0; background: inherit; }
.cp-input-area input[type="text"] { flex: 1; background: var(--input-bg); border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; color: var(--text-main); font-size: 13px; outline: none; transition: border .15s; }
.cp-input-area input[type="text"]:focus { border-color: #58a6ff; }
.cp-input-area button { background: #58a6ff; border: none; border-radius: 8px; padding: 6px 12px; color: #fff; font-size: 13px; cursor: pointer; transition: background .15s; }
.cp-input-area button:hover { background: #4a95e6; }

/* AI 设置面板 */
#ciwei-pet-settings { min-width: 260px; max-width: 300px; padding: 16px; max-height: 70vh; overflow-y: auto; }
#ciwei-pet-settings .cp-set-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
#ciwei-pet-settings .cp-set-title .cp-close-btn { background: none; border: none; color: var(--text-sub); font-size: 16px; cursor: pointer; }
#ciwei-pet-settings .cp-set-group { margin-bottom: 12px; }
#ciwei-pet-settings .cp-set-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
#ciwei-pet-settings .cp-set-group input[type="text"], #ciwei-pet-settings .cp-set-group input[type="password"] { width: 100%; background: var(--input-bg); border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; color: var(--text-main); font-size: 12px; outline: none; }
#ciwei-pet-settings .cp-set-group input:focus { border-color: #58a6ff; }
#ciwei-pet-settings .cp-set-row { display: flex; gap: 6px; }
#ciwei-pet-settings .cp-set-row button { flex: 1; padding: 6px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; background: var(--input-bg); color: var(--text-main); transition: background .15s; }
#ciwei-pet-settings .cp-set-row button:hover { background: var(--item-hover); }
#ciwei-pet-settings .cp-set-row button.primary { background: #58a6ff; color: #fff; }
#ciwei-pet-settings .cp-set-row button.primary:hover { background: #4a95e6; }
#ciwei-pet-settings .cp-set-info { font-size: 11px; color: var(--text-sub); margin-top: 4px; }

/* 恢复按钮 */
#ciwei-pet-restore {
    position: fixed; bottom: 16px; right: 16px; width: 44px; height: 44px;
    border-radius: 50%; background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border); box-shadow: 0 6px 20px rgba(0,0,0,.15);
    display: none; align-items: center; justify-content: center; font-size: 20px;
    cursor: pointer; z-index: 100001; animation: cp-restoreIn .4s cubic-bezier(.22,1,.36,1);
}
#ciwei-pet-restore.show { display: flex; }
#ciwei-pet-restore:hover { transform: scale(1.1); border-color: #58a6ff; }

@media (max-width: 600px) {
    #ciwei-pet .cp-bubble { font-size: 12px; padding: 6px 11px; max-width: 220px; }
    #ciwei-pet .cp-toolbar-btn { width: 25px; height: 25px; font-size: 12px; }
    #ciwei-pet-restore { width: 40px; height: 40px; font-size: 18px; }
    #ciwei-pet-menu .cp-mi { width: 34px; height: 34px; font-size: 15px; }
    #ciwei-pet-dialogue { min-width: 200px; max-width: 240px; }
    #ciwei-pet-settings { min-width: 240px; max-width: 260px; }
}
</style>
</head>
<body>

<!-- 粒子层 -->
<div id="ciwei-pet-particles"></div>

<!-- 一级菜单 -->
<div id="ciwei-pet-menu">
    <div class="cp-mi" data-menu="love"     data-label="摸摸头">❤️</div>
    <div class="cp-mi" data-menu="food"     data-label="喂食">🍎</div>
    <div class="cp-mi" data-menu="dialogue" data-label="聊天">💬</div>
    <div class="cp-mi" data-menu="sleep"    data-label="哄睡">💤</div>
    <div class="cp-mi" data-menu="spin"     data-label="转圈">🔄</div>
    <div class="cp-mi" data-menu="settings" data-label="设置">⚙️</div>
</div>

<!-- 二级菜单 -->
<div id="ciwei-pet-submenu">
    <div class="cp-sub-item" data-menu="roam">🚶 <span>散散步</span></div>
    <div class="cp-sub-item" data-menu="reset">🏠 <span>回角落</span></div>
    <div class="cp-sep"></div>
    <div class="cp-sub-item" data-menu="scale-up">🔍➕ <span>放大</span></div>
    <div class="cp-sub-item" data-menu="scale-down">🔍➖ <span>缩小</span></div>
    <div class="cp-sub-item" data-menu="scale-reset">📏 <span>重置大小</span><span class="cp-sub-check" id="cp-scale-check">100%</span></div>
    <div class="cp-sep"></div>
    <div class="cp-sub-item active" data-menu="sound">🔊 <span>音效</span><span class="cp-sub-check" id="cp-sound-check">开启</span></div>
    <div class="cp-sep"></div>
    <div class="cp-sub-item danger" data-menu="hide">🙈 <span>隐藏</span></div>
</div>

<!-- 聊天面板 -->
<div id="ciwei-pet-dialogue">
    <div class="cp-dlg-header">
        <span class="cp-dlg-title">💬 和小c聊天</span>
        <button class="cp-dlg-close" id="cp-dlg-close">✕</button>
    </div>
    <div id="cp-dlg-body"></div>
    <div class="cp-input-area">
        <button id="cp-upload-btn" style="background:transparent; color:var(--text-sub); font-size:16px; padding:2px;" title="上传图片">📎</button>
        <input type="file" id="cp-file-input" accept="image/*" style="display:none;">
        <input type="text" id="cp-chat-input" placeholder="打字问我..." autocomplete="off">
        <button id="cp-send-btn">发送</button>
    </div>
</div>

<!-- AI 设置面板 -->
<div id="ciwei-pet-settings">
    <div class="cp-set-title">
        <span>⚙️ AI 控制面板</span>
        <button class="cp-close-btn" id="cp-set-close">✕</button>
    </div>
    <div class="cp-set-group">
        <label>🔑 DeepSeek API Key</label>
        <div class="cp-set-row">
            <input type="password" id="cp-set-key" placeholder="sk-...">
            <button id="cp-set-key-save" class="primary" style="flex:0 0 50px;">保存</button>
        </div>
        <div class="cp-set-info" id="cp-set-key-status">未配置</div>
    </div>
    <div class="cp-set-group">
        <label>💰 余额查询</label>
        <div class="cp-set-row">
            <button id="cp-set-balance-btn">查询余额</button>
        </div>
        <div class="cp-set-info" id="cp-set-balance">点击查询</div>
    </div>
    <div class="cp-set-group">
        <label>🧠 模型选择</label>
        <div class="cp-set-row" id="cp-set-model">
            <button data-model="flash" class="active">Flash · 快速</button>
            <button data-model="pro">Pro · 推理</button>
        </div>

// ============================================================
// 主循环
// ============================================================
var lastFrame = performance.now();
function mainLoop(now) {
    tickFPS(now); var dt = (now - lastFrame) / 1000; lastFrame = now; if (dt > .05) dt = .05;
    if (S.sliding && !S.dragging) {
        var friction = Math.pow(.06, dt); S.vx *= friction; S.vy *= friction;
        if (Math.abs(S.vx) < .3 && Math.abs(S.vy) < .3) {

        } else {
            var s = getSize(), nx = S.x + S.vx * dt * 60, ny = S.y + S.vy * dt * 60, hit = false;
            if (nx < 0) { nx = 0; S.vx = -S.vx * .55; hit = true; }
            if (ny < 0) { ny = 0; S.vy = -S.vy * .55; hit = true; }
            if (nx > window.innerWidth - s) { nx = window.innerWidth - s; S.vx = -S.vx * .55; hit = true; }
            if (ny > window.innerHeight - s) { ny = window.innerHeight - s; S.vy = -S.vy * .55; hit = true; }
            setPos(nx, ny, false);
            if (hit) {
                host.classList.add('squash'); setTimeout(function () { host.classList.remove('squash'); }, 300);
                var rect = bodyEl.getBoundingClientRect();
                var side = nx <= 0 ? 'left' : nx >= window.innerWidth - s ? 'right' : ny <= 0 ? 'top' : 'bottom';
                var o = side === 'left' ? { left: rect.left - 10, top: rect.top + rect.height / 2, width: 20, height: 20 } :
                        side === 'right' ? { left: rect.right - 10, top: rect.top + rect.height / 2, width: 20, height: 20 } :
                        side === 'top' ? { left: rect.left + rect.width / 2, top: rect.top - 10, width: 20, height: 20 } :
                                          { left: rect.left + rect.width / 2, top: rect.bottom - 10, width: 20, height: 20 };
                burst('💨', 4, o); SFX.bounce();
            }
        }
    }
    if (S.mouseActive && !S.hidden) {
        var sz = getSize();
        var lx = clamp(((S.mouseX - (S.x - 18)) / (sz + 36)) * 100, 0, 100);
        var ly = clamp(((S.mouseY - (S.y - 18)) / (sz + 36)) * 100, 0, 100);
        lightEl.style.setProperty('--cp-light-x', lx.toFixed(1) + '%'); lightEl.style.setProperty('--cp-light-y', ly.toFixed(1) + '%');
    }

}

    if (S.sleeping) return; var c = clampPos(tx, ty), sx = S.x, sy = S.y;
    var dist = Math.hypot(c.x - sx, c.y - sy), dur = clamp(dist * 4, 400, 1800), startTime = performance.now(); S.sliding = false;

}

// 全局变量：用于存储最近几轮对话历史
var chatHistory = [];

async function sendMessage() {
    var inputEl = document.getElementById('cp-chat-input');
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';

    // 1. 本地指令拦截
    if (checkKeywordsAndAction(text)) return;

    // 2. 检查 Key
    var apiKey = lsGet(KEYS.aiKey);
    if (!apiKey) {
        showBubble('嗡嗡... 我还没有装上 AI 大脑，请先在【设置】里填入 Key 哦！', 4000, false);
        return;
    }

    // 显示用户气泡
    showBubble('你: ' + text, 3000, false);

    // 获取参数
    var model = lsGet(KEYS.aiModel) === 'pro' ? 'deepseek-v4-pro' : 'deepseek-v4-flash';
    var temp = parseFloat(lsGet(KEYS.aiTemp) || '0.7');
    var maxCtx = parseInt(lsGet(KEYS.aiCtx) || '10', 10);
    var streamOn = lsGet(KEYS.aiStream) !== 'false';

    // 获取环境信息
    var envInfo = await getEnvironmentInfo();

    // 构建系统提示词
    var systemPrompt = "你叫小c，是一只可爱的电子刺猬，住在 CiweiHome 里。你的开发者是 LouFoong，你的生日是 2026年9月10日。你说话简短、俏皮、温暖，偶尔会撒娇。回复控制在 50 字以内，不要用 markdown 格式。不要堆砌 emoji，最多一个。" + envInfo;

    // 构建 messages 历史
    var messages = [{ role: 'system', content: systemPrompt }];
    var recentHistory = chatHistory.slice(-maxCtx * 2);
    for (var i = 0; i < recentHistory.length; i++) {
        messages.push(recentHistory[i]);
    }
    messages.push({ role: 'user', content: text });

    showBubble('让我想想...', 2000, false);

    try {
        var response = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: model,
                messages: messages,
                stream: streamOn,
                temperature: temp,
                max_tokens: 1024
            })
        });

        if (!response.ok) {
            var err = await response.text();
            throw new Error('HTTP ' + response.status + ': ' + err);
        }

        var reply = '';
        if (streamOn) {
            // 流式接收
            var reader = response.body.getReader();
            var decoder = new TextDecoder();
            showBubble('', 10000, false);
            while (true) {
                var { done, value } = await reader.read();
                if (done) break;
                var chunk = decoder.decode(value, { stream: true });
                var lines = chunk.split('\n');
                for (var i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('data: ')) {
                        var dataStr = lines[i].slice(6);
                        if (dataStr === '[DONE]') continue;
                        try {
                            var data = JSON.parse(dataStr);
                            var content = data.choices[0].delta.content || '';
                            reply += content;
                            bubble.textContent = reply;
                        } catch (e) {}
                    }
                }
            }
        } else {
            // 非流式接收
            var json = await response.json();
            reply = json.choices[0].message.content;
            showBubble(reply, 6000, true);
        }

        // 记录对话历史
        chatHistory.push({ role: 'user', content: text });
        chatHistory.push({ role: 'assistant', content: reply });
        if (chatHistory.length > 100) chatHistory.shift();

        S.mood = clamp(S.mood + 5, 0, 100);
        updateMoodColor();
        burst('💬', 3);

    } catch (e) {
        showBubble('嗡嗡... 我脑子卡壳了: ' + e.message, 4000, false);
    }
}

// 图片上传与压缩
// ============================================================
document.getElementById('cp-upload-btn').addEventListener('click', function (e) { e.stopPropagation(); document.getElementById('cp-file-input').click(); });
document.getElementById('cp-file-input').addEventListener('change', async function (e) {
    var file = e.target.files[0]; if (!file) return;
    var apiKey = lsGet(KEYS.aiKey);
    if (!apiKey) { showBubble('我还没接上 AI 大脑，看不了图片哦～', 3000, false); return; }

    function sendImageBase64(base64) {
        showBubble('我看看这图...', 2000, false);
        // 针对 DeepSeek V4 的图片格式（注意：实际使用时需遵循官方 API 的 image_url 规范）
        fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
            body: JSON.stringify({
                model: 'deepseek-v4-flash',
                messages: [
                    { role: 'system', content: '你是小c，一只可爱的电子刺猬。看到图片后简短俏皮地评价一下。' },
                    { role: 'user', content: [{ type: 'text', text: '你看这张图' }, { type: 'image_url', image_url: { url: base64 } }] }
                ]
            })
        }).then(function(res) { return res.json(); }).then(function(data) {
            showBubble(data.choices[0].message.content, 5000, false);
        }).catch(function(err) { showBubble('看图片失败: ' + err.message, 4000, false); });
    }

    if (file.size > 500 * 1024) {
        var wantCompress = confirm("小c 眼睛有点小，这张图有点大 (" + (file.size/1024/1024).toFixed(1) + "MB)，要压缩一下再给我看吗？");
        if (wantCompress) {
            var reader = new FileReader();
            reader.onload = function(evt) {
                var imgObj = new Image();
                imgObj.onload = function() {
                    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
                    var maxSize = 1024, width = imgObj.width, height = imgObj.height;
                    if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
                    else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    canvas.width = width; canvas.height = height; ctx.drawImage(imgObj, 0, 0, width, height);
                    var compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    showBubble('嗡嗡，图片压缩好了，我这就看！', 2000, false);
                    sendImageBase64(compressedBase64);
                };
                imgObj.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            var reader2 = new FileReader();
            reader2.onload = function(evt) { sendImageBase64(evt.target.result); };
            reader2.readAsDataURL(file);
        }
    } else {
        var reader3 = new FileReader();
        reader3.onload = function(evt) { sendImageBase64(evt.target.result); };
        reader3.readAsDataURL(file);
    }
    e.target.value = '';
});

// ============================================================
// 菜单与面板绑定
// ============================================================
function showMenuAt(x, y) {
    menu.style.left = x + 'px'; menu.style.top = y + 'px'; menu.classList.add('show'); submenu.classList.remove('show');
    var mr = menu.getBoundingClientRect();
    if (x + mr.width > window.innerWidth - 8) menu.style.left = Math.max(8, window.innerWidth - mr.width - 8) + 'px';
    if (y + mr.height > window.innerHeight - 8) menu.style.top = Math.max(8, y - mr.height - 8) + 'px';
    if (parseFloat(menu.style.top) < 8) menu.style.top = '8px';
}
function showSubmenu() {
    var mr = menu.getBoundingClientRect(); var sx = mr.left, sy = mr.bottom + 4;
    submenu.style.left = sx + 'px'; submenu.style.top = sy + 'px'; submenu.classList.add('show');
    soundChk.textContent = S.soundOn ? '开启' : '关闭'; updateScaleDisplay();
    var sr = submenu.getBoundingClientRect();
    if (sx + sr.width > window.innerWidth - 8) submenu.style.left = Math.max(8, window.innerWidth - sr.width - 8) + 'px';
    if (sy + sr.height > window.innerHeight - 8) submenu.style.top = Math.max(8, mr.top - sr.height - 4) + 'px';
}
host.addEventListener('contextmenu', function (e) { e.preventDefault(); if (isMobile()) return; showMenuAt(e.clientX, e.clientY); });
toolbar.addEventListener('click', function (e) {
    var btn = e.target.closest('.cp-toolbar-btn'); if (!btn) return; e.stopPropagation();
    var act = btn.dataset.action;
    if (act === 'love') doPet(); else if (act === 'food') doFood(); else if (act === 'sleep') doSleepToggle();
    else if (act === 'dialogue') showDialogueAt(); else if (act === 'reset') doReset();
});
toolbar.addEventListener('mouseenter', function () { host.classList.add('show-toolbar'); });
toolbar.addEventListener('mouseleave', function () { host.classList.remove('show-toolbar'); });
restoreBtn.addEventListener('click', doShow);

menu.addEventListener('click', function (e) {
    var item = e.target.closest('[data-menu]'); if (!item) return; e.stopPropagation();
    var act = item.dataset.menu;
    if (act === 'more') { if (submenu.classList.contains('show')) submenu.classList.remove('show'); else showSubmenu(); return; }
    if (act === 'settings') { menu.classList.remove('show'); submenu.classList.remove('show'); setTimeout(function () { showSettingsAt(); }, 60); return; }
    if (act === 'love') { doPet(); menu.classList.remove('show'); }
    else if (act === 'food') { doFood(); menu.classList.remove('show'); }
    else if (act === 'dialogue') { menu.classList.remove('show'); submenu.classList.remove('show'); setTimeout(function () { showDialogueAt(); }, 60); }
    else if (act === 'sleep') { doSleepToggle(); menu.classList.remove('show'); }
    else if (act === 'spin') { doSpin(); menu.classList.remove('show'); }
});
submenu.addEventListener('click', function (e) {
    var item = e.target.closest('[data-menu]'); if (!item) return; e.stopPropagation();
    var act = item.dataset.menu;
    if (act === 'roam') { doRoam(); submenu.classList.remove('show'); menu.classList.remove('show'); }
    else if (act === 'reset') { doReset(); submenu.classList.remove('show'); menu.classList.remove('show'); }
    else if (act === 'hide') { doHide(); submenu.classList.remove('show'); menu.classList.remove('show'); }
    else if (act === 'scale-up') doScaleUp(); else if (act === 'scale-down') doScaleDown(); else if (act === 'scale-reset') doScaleReset();
    else if (act === 'sound') {
        S.soundOn = !S.soundOn; saveSound(); soundChk.textContent = S.soundOn ? '开启' : '关闭';
        item.classList.toggle('active', S.soundOn); if (S.soundOn) { initAudio(); SFX.pet(); }
    }
});
document.addEventListener('click', function (e) {
    if (performance.now() - lastLongPressTime < 600) return;
    var inMenu = e.target.closest('#ciwei-pet-menu'), inSub = e.target.closest('#ciwei-pet-submenu');
    var inDlg = e.target.closest('#ciwei-pet-dialogue'), inSet = e.target.closest('#ciwei-pet-settings'), inPet = e.target.closest('#ciwei-pet');
    if (!inMenu && !inSub && !inPet) { menu.classList.remove('show'); submenu.classList.remove('show'); }
    // 面板不自动关闭
});

// ============================================================
// 彩蛋与初始化
// ============================================================
function checkBirthday() {
    var today = new Date(), md = ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    if (md === PET_PROFILE.birthday.slice(5)) {
        setTimeout(function () { if (S.sleeping || S.hidden) return; showBubble(pick(MSG.birthday), 4000, false); burst('🎂', 10); burst('🎉', 6); SFX.wake(); }, 3000);
    }
}
function checkLateNight() {
    var h = new Date().getHours();
    if (h >= 2 && h < 5) { setTimeout(function () { if (S.sleeping || S.hidden) return; showBubble(pick(MSG.lateNight), 3600, false); }, 5000); }
}
function checkLongTimeNoSee() {
    setTimeout(function () {
        if (S.sleeping || S.hidden) return;
        var idleFor = Date.now() - S.last;
        if (idleFor > 24 * 60 * 60 * 1000) showBubble(pick(MSG.longTimeNoSee), 3200, false);
        else showBubble('你好呀～我是小c 🦔', 2600, false);
        burst('✨', 4);
    }, 1200);
}
document.addEventListener('visibilitychange', function () {
    if (document.hidden) { savePos(); saveSleep(); saveClicks(); lsSet(KEYS.last, String(S.last)); }
    else { lastFrame = performance.now(); }
});
function restore() {
    if (!lsGet(KEYS.meeting)) lsSet(KEYS.meeting, String(Date.now()));
    var savedScale = parseInt(lsGet(KEYS.scale) || String(DEFAULT_SCALE_INDEX), 10);
    if (isNaN(savedScale) || savedScale < 0 || savedScale >= SCALES.length) savedScale = DEFAULT_SCALE_INDEX;
    S.scaleIndex = savedScale; applySize(); updateScaleDisplay();
    var saved = null; try { saved = JSON.parse(lsGet(KEYS.pos) || 'null'); } catch (e) {}
    var s = getSize();
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') { var c = clampPos(saved.x, saved.y); setPos(c.x, c.y, false); }
    else setPos(window.innerWidth - s - 24, window.innerHeight - s - 24, false);
    if (lsGet(KEYS.sleeping) === 'true') { S.sleeping = true; host.classList.add('sleeping'); setImage('sleep'); startZzz(); }
    else { host.classList.add('idle-float'); setImage('idle1'); }
    S.clicks = parseInt(lsGet(KEYS.clicks) || '0', 10) || 0;
    var last = parseInt(lsGet(KEYS.last) || '0', 10); if (last > 0) S.last = last;
    if (lsGet(KEYS.hidden) === 'true') { S.hidden = true; host.classList.add('hidden'); restoreBtn.classList.add('show'); }
    S.soundOn = lsGet(KEYS.sound) !== 'false'; soundChk.textContent = S.soundOn ? '开启' : '关闭'; updateMoodColor();
}
for (var k in IMAGES) { if (IMAGES.hasOwnProperty(k)) { var _i = new Image(); _i.src = IMAGES[k]; } }
restore(); requestAnimationFrame(function () { host.classList.add('ready'); }); requestAnimationFrame(mainLoop); scheduleIdleAction();
checkLongTimeNoSee(); checkBirthday(); checkLateNight();
var rt = null;
window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(function () {
        applySize(); var c = clampPos(S.x, S.y); setPos(c.x, c.y, false); savePos();
        if (S.dialogueOpen) { hideDialogue(); showDialogueAt(); }
        if (settings.classList.contains('show')) { settings.classList.remove('show'); showSettingsAt(); }
    }, 150);
});
window.addEventListener('beforeunload', function () { savePos(); saveSleep(); saveClicks(); lsSet(KEYS.last, String(S.last)); });
console.log('%c🦔 小c · 电子宠物 已启动', 'font-size:16px;color:#58a6ff;font-weight:bold');
console.log('⚡ ' + measuredFPS + 'fps · ' + getScalePercent() + '%');

})();
