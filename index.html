<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦔 小c · 电子宠物</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58a6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小c">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0f;
    font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
#cp-pet {
    position: fixed; left: 0; top: 0;
    width: 120px; height: 120px;
    z-index: 9999;
    transform: translate3d(-9999px, -9999px, 0);
    will-change: transform;
    cursor: grab; touch-action: none;
    opacity: 0;
    transition: opacity .4s ease;
}
#cp-pet.ready { opacity: 1; }
#cp-pet.dragging { cursor: grabbing; }
#cp-pet.hidden { display: none; }
#cp-pet .cp-body { position: relative; width: 100%; height: 100%; }
#cp-pet .cp-img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 5px 14px rgba(0,0,0,.3));
    -webkit-user-drag: none;
}
#cp-pet .cp-shadow {
    position: absolute; bottom: -6px; left: 50%;
    transform: translateX(-50%);
    width: 66%; height: 9px;
    background: radial-gradient(ellipse, rgba(0,0,0,.4) 0%, transparent 72%);
    border-radius: 50%; pointer-events: none; z-index: -1;
}
#cp-pet .cp-bubble {
    position: absolute; left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(6px) scale(.9);
    background: rgba(30, 30, 45, .95); color: #fff;
    padding: 8px 14px;
    border-radius: 14px 14px 4px 14px;
    font-size: 13px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    width: max-content; max-width: 260px; min-width: 60px;
    white-space: nowrap; text-align: left;
    opacity: 0; transition: all .26s ease;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,.1);
    z-index: 10;
}
#cp-pet .cp-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
#cp-pet .cp-bubble.long { white-space: normal; word-break: break-word; }
#cp-pet .cp-bubble::after {
    content: ''; position: absolute;
    bottom: -5px; right: 18px; width: 10px; height: 10px;
    background: rgba(30, 30, 45, .95);
    transform: rotate(45deg);
    border-right: 1px solid rgba(255,255,255,.1);
    border-bottom: 1px solid rgba(255,255,255,.1);
    border-radius: 0 0 2px 0;
}
#cp-menu {
    position: fixed; background: rgba(28, 28, 42, .97);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 5px;
    box-shadow: 0 12px 36px rgba(0,0,0,.5);
    z-index: 10000; display: none; gap: 2px;
}
#cp-menu.show { display: flex; }
#cp-menu .cp-mi {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer; color: #fff;
}
#cp-menu .cp-mi:hover { background: rgba(255,255,255,.12); }
#cp-menu .cp-mi:active { transform: scale(.92); }
#cp-chat, #cp-settings {
    position: fixed; background: rgba(28, 28, 42, .97);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 0;
    box-shadow: 0 16px 44px rgba(0,0,0,.5);
    z-index: 10000; display: none;
    flex-direction: column; color: #fff;
    font-size: 13px;
}
#cp-chat.show, #cp-settings.show { display: flex; }
#cp-chat { min-width: 240px; max-width: 300px; max-height: 55vh; }
#cp-settings { width: 260px; max-height: 65vh; overflow-y: auto; }
#cp-chat .cp-chat-header, #cp-settings .cp-settings-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,.85);
    flex-shrink: 0;
}
#cp-chat .cp-chat-close, #cp-settings .cp-settings-close {
    background: none; border: none; color: rgba(255,255,255,.5);
    font-size: 16px; cursor: pointer; padding: 2px 6px;
}
#cp-chat .cp-chat-body {
    flex: 1; overflow-y: auto; padding: 8px;
    line-height: 1.6; min-height: 100px; max-height: 300px;
}
#cp-chat .cp-msg-user { text-align: right; color: #58a6ff; padding: 4px 0; }
#cp-chat .cp-msg-ai {
    text-align: left; color: #fff; padding: 4px 0;
    white-space: pre-wrap; word-break: break-word;
}
#cp-chat .cp-chat-input-area {
    display: flex; gap: 6px; padding: 8px 10px;
    border-top: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
}
#cp-chat input[type="text"] {
    flex: 1; min-width: 0; padding: 8px 12px;
    background: rgba(255,255,255,.08);
    border: 1px solid transparent; border-radius: 8px;
    color: #fff; font-size: 13px; outline: none;
}
#cp-chat input[type="text"]:focus { border-color: #58a6ff; }
#cp-chat .cp-send-btn {
    padding: 8px 14px; background: #58a6ff; color: #fff;
    border: none; border-radius: 8px; font-size: 13px; cursor: pointer;
}
#cp-chat .cp-upload-btn {
    padding: 8px 10px; background: transparent;
    border: none; color: rgba(255,255,255,.6);
    font-size: 16px; cursor: pointer;
}
#cp-settings .cp-set-field { padding: 12px 14px 0; }
#cp-settings .cp-set-field label {
    display: block; font-size: 11px;
    color: rgba(255,255,255,.55); margin-bottom: 6px;
}
#cp-settings .cp-set-field input[type="password"],
#cp-settings .cp-set-field input[type="text"] {
    width: 100%; padding: 8px 10px;
    background: rgba(255,255,255,.08);
    border: 1px solid transparent; border-radius: 8px;
    color: #fff; font-size: 12px; outline: none;
    font-family: monospace;
}
#cp-settings .cp-set-field input:focus { border-color: #58a6ff; }
#cp-settings .cp-set-hint {
    font-size: 10px; color: rgba(255,255,255,.4);
    margin-top: 4px; line-height: 1.5;
}
#cp-settings .cp-set-actions {
    display: flex; gap: 6px; padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    margin-top: 12px;
}
#cp-settings .cp-set-actions button {
    flex: 1; padding: 8px 6px; font-size: 11px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.06); color: #fff;
}
#cp-settings .cp-set-actions button:hover { background: rgba(255,255,255,.12); }
#cp-settings .cp-set-actions button.primary {
    background: #58a6ff; border-color: #58a6ff;
}
#cp-settings .cp-set-actions button.danger:hover {
    background: rgba(239,68,68,.2); border-color: #ef4444;
}
#cp-settings .cp-balance-box {
    margin: 12px 14px 0;
    background: rgba(255,255,255,.06);
    border-radius: 8px; padding: 12px;
}
#cp-settings .cp-balance-amount {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, #58a6ff, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
#cp-settings .cp-set-status {
    font-size: 11px; text-align: center;
    padding: 8px; min-height: 26px;
    color: rgba(255,255,255,.55);
}
#cp-settings .cp-set-status.ok { color: #22c55e; }
#cp-settings .cp-set-status.err { color: #ef4444; }
#cp-restore {
    position: fixed; bottom: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(30, 30, 45, .9);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    display: none; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; z-index: 10001;
}
#cp-restore.show { display: flex; }
#cp-debug {
    position: fixed; left: 8px; bottom: 8px;
    background: rgba(239,68,68,.9); color: #fff;
    font-size: 11px; padding: 4px 8px; border-radius: 4px;
    display: none; z-index: 99999;
    max-width: 90vw; word-break: break-all;
}
</style>
</head>
<body>

<div id="cp-debug"></div>
<div id="cp-pet">
    <div class="cp-bubble"></div>
    <div class="cp-body">
        <img class="cp-img" alt="小c" draggable="false">
        <div class="cp-shadow"></div>
    </div>
</div>
<div id="cp-menu">
    <div class="cp-mi" data-a="pet">❤️</div>
    <div class="cp-mi" data-a="food">🍎</div>
    <div class="cp-mi" data-a="chat">💬</div>
    <div class="cp-mi" data-a="spin">🔄</div>
    <div class="cp-mi" data-a="sleep">💤</div>
    <div class="cp-mi" data-a="settings">⚙️</div>
    <div class="cp-mi" data-a="hide">🙈</div>
</div>
<div id="cp-chat">
    <div class="cp-chat-header">
        <span>💬 和小c聊天</span>
        <button class="cp-chat-close" id="cp-chat-close">✕</button>
    </div>
    <div class="cp-chat-body" id="cp-chat-body"></div>
    <div class="cp-chat-input-area">
        <button class="cp-upload-btn" id="cp-upload-btn" title="上传图片">📎</button>
        <input type="file" id="cp-file-input" accept="image/*" style="display:none;">
        <input type="text" id="cp-chat-input" placeholder="打字问我…" autocomplete="off">
        <button class="cp-send-btn" id="cp-send-btn">发送</button>
    </div>
</div>
<div id="cp-settings">
    <div class="cp-settings-header">
        <span>⚙️ AI 设置</span>
        <button class="cp-settings-close" id="cp-settings-close">✕</button>
    </div>
    <div class="cp-set-field">
        <label>🔑 DeepSeek API Key</label>
        <input type="password" id="cp-set-key" placeholder="sk-...">
        <div class="cp-set-hint" id="cp-set-key-status">未配置</div>
    </div>
    <div class="cp-set-field">
        <label>💰 余额</label>
        <div class="cp-balance-box">
            <div class="cp-balance-amount" id="cp-set-balance">点击下方查询</div>
        </div>
    </div>
    <div class="cp-set-actions">
        <button id="cp-set-test">🔍 测试</button>
        <button id="cp-set-query">💰 查询</button>
        <button id="cp-set-save" class="primary">💾 保存</button>
        <button id="cp-set-clear" class="danger">🗑️ 清除</button>
    </div>
    <div class="cp-set-status" id="cp-set-status"></div>
</div>
<div id="cp-restore">🦔</div>

<script>
(function () {
    'use strict';

    function showDebug(msg) {
        var d = document.getElementById('cp-debug');
        d.style.display = 'block';
        d.textContent = String(msg).slice(0, 200);
    }
    window.addEventListener('error', function (e) {
        showDebug('JS错误: ' + (e.message || '未知'));
    });

    var NAME = '小c';
    var DEVELOPER = 'LouFoong';
    var BIRTHDAY = '2026-09-10';
    var IMG_BASE = './';
    var IMAGES = {
        idle1: IMG_BASE + 'idle-1.png',
        idle2: IMG_BASE + 'idle-2.png',
        blink: IMG_BASE + 'blink.png',
        happy: IMG_BASE + 'happy.png',
        surprised: IMG_BASE + 'surprised.png',
        angry: IMG_BASE + 'angry.png',
        sleep: IMG_BASE + 'sleep.png'
    };
    var KEYS = {
        pos: 'ciwei_pet_position',
        sleeping: 'ciwei_pet_sleeping',
        hidden: 'ciwei_pet_hidden',
        sound: 'ciwei_pet_sound',
        scale: 'ciwei_pet_scale_index',
        aiKey: 'ciwei_ai_key',
        aiHist: 'ciwei_pet_ai_history'
    };
    var SYSTEM_PROMPT = '你叫小c，是一只可爱的电子刺猬，住在 CiweiHome 里。你的开发者是 ' + DEVELOPER + '，你的生日是 2026年9月10日。你说话简短、俏皮、温暖，偶尔会撒娇。回复控制在 50 字以内，不要用 markdown 格式。不要堆砌 emoji，最多一个。你的名字只有一个，就是“小c”。绝对禁止称呼自己为“小ci”或者“小cI”。';

    function rand(a, b) { return a + Math.random() * (b - a); }
    function clamp(v, a, b) { return Math.max(a, Math.min(v, b)); }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    function getDaysSinceBirth() {
        var birthBeijingUTC = Date.UTC(2026, 8, 9, 16, 0, 0);
        var now = Date.now();
        var diffDays = Math.floor((now - birthBeijingUTC) / 86400000);
        return diffDays >= 0 ? diffDays : 0;
    }

    var pet = document.getElementById('cp-pet');
    var img = pet.querySelector('.cp-img');
    var bubble = pet.querySelector('.cp-bubble');
    var menu = document.getElementById('cp-menu');
    var chat = document.getElementById('cp-chat');
    var chatBody = document.getElementById('cp-chat-body');
    var chatInput = document.getElementById('cp-chat-input');
    var chatSend = document.getElementById('cp-send-btn');
    var chatClose = document.getElementById('cp-chat-close');
    var uploadBtn = document.getElementById('cp-upload-btn');
    var fileInput = document.getElementById('cp-file-input');
    var settings = document.getElementById('cp-settings');
    var settingsClose = document.getElementById('cp-settings-close');
    var setKey = document.getElementById('cp-set-key');
    var setKeyStatus = document.getElementById('cp-set-key-status');
    var setBalance = document.getElementById('cp-set-balance');
    var setStatus = document.getElementById('cp-set-status');
    var setTest = document.getElementById('cp-set-test');
    var setQuery = document.getElementById('cp-set-query');
    var setSave = document.getElementById('cp-set-save');
    var setClear = document.getElementById('cp-set-clear');
    var restoreBtn = document.getElementById('cp-restore');

    var S = {
        x: 0, y: 0,
        sleeping: false, hidden: false,
        dragging: false, moved: false,
        sClientX: 0, sClientY: 0, sPosX: 0, sPosY: 0,
        vx: 0, vy: 0,
        lastMoveX: 0, lastMoveY: 0, lastMoveTime: 0,
        sliding: false, soundOn: true,
        bubbleTimer: null, typeTimer: null, faceTimer: null,
        aiThinking: false, chatOpen: false
    };
    var SIZE = 120;
    var THROW_THRESHOLD = 4.0;

    // 音效
    var audioCtx = null;
    function initAudio() {
        if (audioCtx) return;
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    function tone(opt) {
        if (!S.soundOn || !audioCtx) return;
        try {
            var t = audioCtx.currentTime;
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.type = opt.type || 'sine';
            o.frequency.setValueAtTime(opt.freq || 440, t);
            if (opt.slideTo) o.frequency.exponentialRampToValueAtTime(opt.slideTo, t + (opt.dur || .1));
            g.gain.setValueAtTime(opt.gain || .3, t);
            g.gain.exponentialRampToValueAtTime(.001, t + (opt.dur || .1));
            o.connect(g).connect(audioCtx.destination);
            o.start(t); o.stop(t + (opt.dur || .1));
        } catch (e) {}
    }
    var SFX = {
        click: function () { tone({ freq: 660, dur: .09, type: 'triangle', gain: .3, slideTo: 880 }); },
        pet: function () { tone({ freq: 523, dur: .15, gain: .3, slideTo: 784 }); },
        food: function () { tone({ freq: 880, dur: .18, gain: .3, slideTo: 1320 }); },
        sleep: function () { tone({ freq: 392, dur: .4, gain: .25, slideTo: 262 }); },
        wake: function () { tone({ freq: 440, dur: .25, gain: .3, slideTo: 880 }); },
        spin: function () { tone({ freq: 1200, dur: .35, type: 'sawtooth', gain: .25, slideTo: 400 }); },
        talk: function () { tone({ freq: 700, dur: .08, type: 'triangle', gain: .2, slideTo: 900 }); }
    };

    function setImage(name) {
        if (!IMAGES[name]) return;
        img.src = IMAGES[name];
        img.onerror = function () {
            img.style.background = 'rgba(88,166,255,.2)';
            img.alt = '🦔 小c';
        };
        img.onload = function () { img.style.background = 'transparent'; };
    }

    function showBubble(text, duration, typewriter) {
        duration = duration || 2600;
        typewriter = typewriter !== false;
        clearTimeout(S.bubbleTimer);
        clearInterval(S.typeTimer);
        var needWrap = text.length > 14;
        bubble.classList.toggle('long', needWrap);
        bubble.classList.add('show');
        if (!typewriter) { bubble.textContent = text; }
        else {
            bubble.textContent = '';
            var i = 0;
            S.typeTimer = setInterval(function () {
                bubble.textContent += text[i++];
                if (i >= text.length) clearInterval(S.typeTimer);
            }, 30);
        }
        S.bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, duration + (typewriter ? text.length * 30 : 0));
    }

    function setPos(x, y) {
        S.x = x; S.y = y;
        pet.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    }
    function clampPos(x, y) {
        return { x: clamp(x, 0, Math.max(0, window.innerWidth - SIZE)), y: clamp(y, 0, Math.max(0, window.innerHeight - SIZE)) };
    }
    function savePos() { lsSet(KEYS.pos, JSON.stringify({ x: Math.round(S.x), y: Math.round(S.y) })); }

    function goSleep() {
        if (S.sleeping) return;
        S.sleeping = true; lsSet(KEYS.sleeping, 'true');
        setImage('sleep'); showBubble('晚安～', 2200, false); SFX.sleep();
    }
    function wakeUp() {
        if (!S.sleeping) return;
        S.sleeping = false; lsSet(KEYS.sleeping, 'false');
        setImage('surprised'); showBubble('唔……醒啦！', 1800, false); SFX.wake();
        setTimeout(function () { if (!S.sleeping) setImage('idle1'); }, 1200);
    }
    function doPet() {
        initAudio(); if (S.sleeping) { wakeUp(); return; }
        setImage('happy'); showBubble('嘿嘿～好开心！', 1800, false); SFX.pet();
        setTimeout(function () { if (!S.sleeping) setImage('idle1'); }, 1600);
    }
    function doFood() {
        initAudio(); if (S.sleeping) wakeUp();
        setImage('happy'); showBubble('🍎 好吃！谢谢～', 1800, false); SFX.food();
        setTimeout(function () { if (!S.sleeping) setImage('idle1'); }, 1800);
    }
    function doSpin() {
        initAudio(); if (S.sleeping) wakeUp();
        setImage('happy'); showBubble('转圈圈～', 1600, false); SFX.spin();
        pet.style.transition = 'transform .85s cubic-bezier(.34,1.56,.64,1)';
        var oldTransform = pet.style.transform;
        pet.style.transform = oldTransform + ' rotate(360deg)';
        setTimeout(function () {
            pet.style.transition = '';
            pet.style.transform = oldTransform;
            if (!S.sleeping) setImage('idle1');
        }, 880);
    }
    function doSleepToggle() { initAudio(); if (S.sleeping) wakeUp(); else goSleep(); }

    function showMenuAt(x, y) {
        menu.style.left = x + 'px'; menu.style.top = y + 'px';
        menu.classList.add('show');
        var mr = menu.getBoundingClientRect();
        if (x + mr.width > window.innerWidth - 8) menu.style.left = (window.innerWidth - mr.width - 8) + 'px';
        if (y + mr.height > window.innerHeight - 8) menu.style.top = (window.innerHeight - mr.height - 8) + 'px';
    }
    function hideMenu() { menu.classList.remove('show'); }

    function showChat() {
        S.chatOpen = true;
        chat.classList.add('show');
        var s = SIZE;
        var px = S.x + s + 8, py = S.y;
        chat.style.left = px + 'px'; chat.style.top = py + 'px';
        var cr = chat.getBoundingClientRect();
        if (px + cr.width > window.innerWidth - 8) chat.style.left = Math.max(8, S.x - cr.width - 8) + 'px';
        if (py + cr.height > window.innerHeight - 8) chat.style.top = Math.max(8, window.innerHeight - cr.height - 8) + 'px';
    }
    function hideChat() { S.chatOpen = false; chat.classList.remove('show'); }
    function appendMsg(role, text) {
        var div = document.createElement('div');
        div.className = 'cp-msg-' + role;
        div.textContent = (role === 'user' ? '你: ' : '小c: ') + text;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // AI
    function getApiKey() { return lsGet(KEYS.aiKey) || ''; }
    function getHistory() {
        var raw = lsGet(KEYS.aiHist);
        if (!raw) return [];
        try { return JSON.parse(raw) || []; } catch (e) { return []; }
    }
    function pushHistory(role, content) {
        if (typeof content === 'string') content = content.replace(/小ci/g, '小c');
        var h = getHistory();
        h.push({ role: role, content: content });
        if (h.length > 100) h = h.slice(-100);
        lsSet(KEYS.aiHist, JSON.stringify(h));
    }

    function checkLocalCommand(text) {
        if (text.indexOf('转两圈') !== -1 || text.indexOf('转个圈') !== -1) {
            doSpin(); showBubble('嗡嗡！看我转两圈~ 头晕啦！', 2000, false); return true;
        }
        if (text.indexOf('睡觉') !== -1 || text.indexOf('困了') !== -1) { doSleepToggle(); return true; }
        if (text.indexOf('摸摸头') !== -1 || text.indexOf('摸头') !== -1) { doPet(); return true; }
        if (text.indexOf('喂食') !== -1 || text.indexOf('吃苹果') !== -1) { doFood(); return true; }
        return false;
    }

    function getWeather() {
        return fetch('https://wttr.in/?format=%C+%t').then(function (r) { return r.text(); }).catch(function () { return '未知'; });
    }

    function askAI(userInput) {
        var apiKey = getApiKey();
        if (!apiKey) {
            showBubble('我还没有 AI 大脑…请先在【设置】里填入 Key 哦', 3000, false);
            appendMsg('ai', '（还没配置 API Key，请点菜单里的 ⚙️ 设置）');
            return;
        }
        S.aiThinking = true;
        pushHistory('user', userInput);
        setImage('surprised');

        var history = getHistory();
        var recent = history.slice(-20 - 1, -1);
        var now = new Date();
        var timeStr = now.toLocaleString('zh-CN', { hour12: false });

        getWeather().then(function (weather) {
            var envInfo = '\n【系统提示：当前真实时间是 ' + timeStr + '，用户所在地天气是 ' + weather + '。如果用户问天气或时间，请根据此信息回答。】';
            var messages = [{ role: 'system', content: SYSTEM_PROMPT + envInfo }];
            for (var i = 0; i < recent.length; i++) messages.push({ role: recent[i].role, content: recent[i].content });
            messages.push({ role: 'user', content: userInput });

            var body = {
                model: 'deepseek-v4-flash',
                messages: messages,
                temperature: 0.7,
                max_tokens: 1024,
                stream: true
            };

            fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify(body)
            }).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                if (!res.body) {
                    return res.json().then(function (json) {
                        var reply = json.choices[0].message.content;
                        appendMsg('ai', reply); pushHistory('assistant', reply);
                        showBubble(reply, 5000, false); setImage('happy'); S.aiThinking = false;
                    });
                }
                var reader = res.body.getReader();
                var decoder = new TextDecoder();
                var fullText = '', buffer = '';
                var aiDiv = document.createElement('div');
                aiDiv.className = 'cp-msg-ai';
                aiDiv.textContent = '小c: ';
                chatBody.appendChild(aiDiv);
                chatBody.scrollTop = chatBody.scrollHeight;

                function pump() {
                    return reader.read().then(function (result) {
                        if (result.done) {
                            pushHistory('assistant', fullText);
                            showBubble(fullText, 60000, false);
                            setImage('happy');
                            S.aiThinking = false;
                            return;
                        }
                        buffer += decoder.decode(result.value, { stream: true });
                        var lines = buffer.split('\n');
                        buffer = lines.pop();
                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i].trim();
                            if (!line || line.indexOf('data: ') !== 0) continue;
                            var data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                var json = JSON.parse(data);
                                var delta = json.choices && json.choices[0] && json.choices[0].delta;
                                if (delta && delta.content) {
                                    fullText += delta.content;
                                    aiDiv.textContent = '小c: ' + fullText;
                                    chatBody.scrollTop = chatBody.scrollHeight;
                                    showBubble(fullText, 60000, false);
                                }
                            } catch (e) {}
                        }
                        return pump();
                    });
                }
                return pump();
            }).catch(function (err) {
                appendMsg('ai', '连接失败: ' + err.message);
                showBubble('唔…连接失败：' + err.message, 4000, false);
                setImage('angry'); S.aiThinking = false;
            });
        });
    }

    function sendUserInput() {
        var text = chatInput.value.trim();
        if (!text) return;
        if (S.aiThinking) { showBubble('我还在想上一个问题呢…', 1500, false); return; }
        chatInput.value = '';
        appendMsg('user', text);
        if (checkLocalCommand(text)) return;
        askAI(text);
    }

    // 图片上传
    uploadBtn.addEventListener('click', function (e) { e.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var apiKey = getApiKey();
        if (!apiKey) { showBubble('我还没接上 AI 大脑，看不了图片哦～', 3000, false); return; }

        function sendImageBase64(base64) {
            appendMsg('user', '[上传了一张图片]');
            showBubble('我看看这图...', 2000, false);
            var payload = {
                model: 'deepseek-v4-flash',
                messages: [
                    { role: 'system', content: '你是小c，一只可爱的电子刺猬。看到图片后简短俏皮地评价一下，控制在50字以内。' },
                    { role: 'user', content: [{ type: 'text', text: '你看这张图' }, { type: 'image_url', image_url: { url: base64 } }] }
                ]
            };
            fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify(payload)
            }).then(function (res) { return res.json(); }).then(function (data) {
                if (data.choices && data.choices[0]) {
                    var reply = data.choices[0].message.content;
                    appendMsg('ai', reply);
                    showBubble(reply, 5000, false);
                    pushHistory('user', '[上传了一张图片]');
                    pushHistory('assistant', reply);
                } else {
                    showBubble('这图有点奇怪，我看不清...', 4000, false);
                }
            }).catch(function (err) { showBubble('看图片失败: ' + err.message, 4000, false); });
        }

        if (file.size > 500 * 1024) {
            var wantCompress = confirm('图片有点大 (' + (file.size / 1024 / 1024).toFixed(1) + 'MB)，要压缩一下再给我看吗？');
            if (wantCompress) {
                var reader = new FileReader();
                reader.onload = function (evt) {
                    var imgObj = new Image();
                    imgObj.onload = function () {
                        var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
                        var maxSize = 1024, width = imgObj.width, height = imgObj.height;
                        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
                        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(imgObj, 0, 0, width, height);
                        sendImageBase64(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    imgObj.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                var r2 = new FileReader();
                r2.onload = function (evt) { sendImageBase64(evt.target.result); };
                r2.readAsDataURL(file);
            }
        } else {
            var r3 = new FileReader();
            r3.onload = function (evt) { sendImageBase64(evt.target.result); };
            r3.readAsDataURL(file);
        }
        fileInput.value = '';
    });

    // 设置面板
    function showSettings() {
        settings.classList.add('show');
        setKey.value = getApiKey();
        setKeyStatus.textContent = getApiKey() ? '已配置' : '未配置';
        setStatus.textContent = '';
        setStatus.className = 'cp-set-status';
    }
    function hideSettings() { settings.classList.remove('show'); }

    setSave.addEventListener('click', function () {
        var k = setKey.value.trim();
        if (!k) { setStatus.textContent = '⚠️ 请填写 API Key'; setStatus.className = 'cp-set-status err'; return; }
        lsSet(KEYS.aiKey, k);
        setKeyStatus.textContent = '已配置 (' + k.slice(0, 7) + '...)';
        setStatus.textContent = '✅ 已保存到本机'; setStatus.className = 'cp-set-status ok';
    });
    setClear.addEventListener('click', function () {
        if (!confirm('确定清除 API Key 和对话历史吗？')) return;
        lsSet(KEYS.aiKey, '');
        lsSet(KEYS.aiHist, '[]');
        setKey.value = ''; setKeyStatus.textContent = '未配置';
        setStatus.textContent = '🗑️ 已清除'; setStatus.className = 'cp-set-status';
    });
    setTest.addEventListener('click', function () {
        var k = setKey.value.trim() || getApiKey();
        if (!k) { setStatus.textContent = '⚠️ 请先填 API Key'; setStatus.className = 'cp-set-status err'; return; }
        setStatus.textContent = '⏳ 测试中…'; setStatus.className = 'cp-set-status';
        fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + k },
            body: JSON.stringify({ model: 'deepseek-v4-flash', messages: [{ role: 'user', content: '回复"OK"' }], max_tokens: 10 })
        }).then(function (res) {
            if (res.ok) { setStatus.textContent = '✅ 连接成功'; setStatus.className = 'cp-set-status ok'; }
            else { setStatus.textContent = '❌ 失败 (HTTP ' + res.status + ')'; setStatus.className = 'cp-set-status err'; }
        }).catch(function (err) { setStatus.textContent = '❌ 网络错误：' + err.message; setStatus.className = 'cp-set-status err'; });
    });
    setQuery.addEventListener('click', function () {
        var k = setKey.value.trim() || getApiKey();
        if (!k) { setBalance.textContent = '请先配置 Key'; return; }
        setBalance.textContent = '查询中...';
        fetch('https://api.deepseek.com/user/balance', { headers: { 'Authorization': 'Bearer ' + k } })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.balance_infos && data.balance_infos.length > 0) {
                    var info = data.balance_infos[0];
                    setBalance.textContent = '¥ ' + info.total_balance;
                } else { setBalance.textContent = '查询失败'; }
            }).catch(function () { setBalance.textContent = '网络错误'; });
    });
    settingsClose.addEventListener('click', hideSettings);

    // 拖拽
    function onDown(e) {
        if (e.target.closest('#cp-menu') || e.target.closest('#cp-chat') || e.target.closest('#cp-settings')) return;
        if (e.button && e.button !== 0) return;
        initAudio();
        S.dragging = true; S.moved = false;
        pet.classList.add('dragging');
        var p = e.touches ? e.touches[0] : e;
        S.sClientX = p.clientX; S.sClientY = p.clientY;
        S.sPosX = S.x; S.sPosY = S.y;
        S.vx = 0; S.vy = 0;
        S.lastMoveX = p.clientX; S.lastMoveY = p.clientY;
        S.lastMoveTime = performance.now();
        e.preventDefault();
    }
    function onMove(e) {
        if (!S.dragging) return;
        e.preventDefault();
        var p = e.touches ? e.touches[0] : e;
        var dx = p.clientX - S.sClientX, dy = p.clientY - S.sClientY;
        if (!S.moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) S.moved = true;
        if (!S.moved) return;
        var c = clampPos(S.sPosX + dx, S.sPosY + dy);
        setPos(c.x, c.y);
        var now = performance.now(), dt = now - S.lastMoveTime;
        if (dt > 0) { S.vx = (p.clientX - S.lastMoveX) / dt * 16; S.vy = (p.clientY - S.lastMoveY) / dt * 16; }
        S.lastMoveX = p.clientX; S.lastMoveY = p.clientY; S.lastMoveTime = now;
    }
    function onUp() {
        if (!S.dragging) return;
        S.dragging = false;
        pet.classList.remove('dragging');
        if (!S.moved) {
            initAudio(); SFX.click();
            setImage('happy');
            showBubble('你戳我干什么？', 1500, false);
            setTimeout(function () { if (!S.sleeping) setImage('idle1'); }, 1200);
            return;
        }
        savePos();
        var speed = Math.hypot(S.vx, S.vy);
        if (speed > THROW_THRESHOLD) S.sliding = true;
    }
    pet.addEventListener('mousedown', onDown);
    pet.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
    img.addEventListener('dragstart', function (e) { e.preventDefault(); });

    var lastFrame = performance.now();
    function mainLoop(now) {
        var dt = (now - lastFrame) / 1000; lastFrame = now;
        if (dt > .05) dt = .05;
        if (S.sliding && !S.dragging) {
            var friction = Math.pow(.06, dt);
            S.vx *= friction; S.vy *= friction;
            if (Math.abs(S.vx) < .3 && Math.abs(S.vy) < .3) {
                S.sliding = false;
                var c = clampPos(S.x, S.y); setPos(c.x, c.y); savePos();
            } else {
                var nx = S.x + S.vx * dt * 60, ny = S.y + S.vy * dt * 60;
                if (nx < 0) { nx = 0; S.vx = -S.vx * .55; }
                if (ny < 0) { ny = 0; S.vy = -S.vy * .55; }
                if (nx > window.innerWidth - SIZE) { nx = window.innerWidth - SIZE; S.vx = -S.vx * .55; }
                if (ny > window.innerHeight - SIZE) { ny = window.innerHeight - SIZE; S.vy = -S.vy * .55; }
                setPos(nx, ny);
            }
        }
        requestAnimationFrame(mainLoop);
    }

    setInterval(function () {
        if (S.sleeping || S.hidden || S.dragging) return;
        if (img.src.indexOf('idle-1') !== -1) setImage('idle2');
        else if (img.src.indexOf('idle-2') !== -1) setImage('idle1');
    }, 1000);

    (function blinkLoop() {
        setTimeout(function () {
            if (!S.sleeping && !S.hidden && !S.dragging &&
                (img.src.indexOf('idle-1') !== -1 || img.src.indexOf('idle-2') !== -1)) {
                var prev = img.src.indexOf('idle-1') !== -1 ? 'idle1' : 'idle2';
                setImage('blink');
                setTimeout(function () { if (img.src.indexOf('blink') !== -1) setImage(prev); }, 280);
            }
            blinkLoop();
        }, rand(3000, 7000));
    })();

    pet.addEventListener('contextmenu', function (e) { e.preventDefault(); showMenuAt(e.clientX, e.clientY); });
    var longPressTimer = null;
    pet.addEventListener('touchstart', function (e) {
        var p = e.touches[0];
        longPressTimer = setTimeout(function () {
            if (!S.moved) {
                if (navigator.vibrate) { try { navigator.vibrate(25); } catch (err) {} }
                showMenuAt(p.clientX, p.clientY);
                S.dragging = false; pet.classList.remove('dragging');
            }
        }, 500);
    });
    pet.addEventListener('touchend', function () { clearTimeout(longPressTimer); });
    pet.addEventListener('touchmove', function () { clearTimeout(longPressTimer); });

    menu.addEventListener('click', function (e) {
        var item = e.target.closest('.cp-mi');
        if (!item) return;
        e.stopPropagation();
        var act = item.dataset.a;
        if (act === 'pet') doPet();
        else if (act === 'food') doFood();
        else if (act === 'chat') { hideMenu(); showChat(); }
        else if (act === 'spin') doSpin();
        else if (act === 'sleep') doSleepToggle();
        else if (act === 'settings') { hideMenu(); showSettings(); }
        else if (act === 'hide') {
            S.hidden = true; lsSet(KEYS.hidden, 'true');
            pet.classList.add('hidden'); restoreBtn.classList.add('show');
        }
        hideMenu();
    });

    restoreBtn.addEventListener('click', function () {
        S.hidden = false; lsSet(KEYS.hidden, 'false');
        pet.classList.remove('hidden'); restoreBtn.classList.remove('show');
    });

    chatClose.addEventListener('click', hideChat);
    chatSend.addEventListener('click', sendUserInput);
    chatInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); sendUserInput(); } });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('#cp-menu') && !e.target.closest('#cp-pet')) hideMenu();
    });

    function init() {
        var saved = null;
        try { saved = JSON.parse(lsGet(KEYS.pos) || 'null'); } catch (e) {}
        var s = SIZE;
        if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
            var c = clampPos(saved.x, saved.y); setPos(c.x, c.y);
        } else setPos(window.innerWidth - s - 24, window.innerHeight - s - 24);
        if (lsGet(KEYS.sleeping) === 'true') { S.sleeping = true; setImage('sleep'); }
        else setImage('idle1');
        if (lsGet(KEYS.hidden) === 'true') { S.hidden = true; pet.classList.add('hidden'); restoreBtn.classList.add('show'); }
        S.soundOn = lsGet(KEYS.sound) !== 'false';
        requestAnimationFrame(function () {
            pet.classList.add('ready');
            requestAnimationFrame(mainLoop);
        });
    }

    window.addEventListener('resize', function () {
        var c = clampPos(S.x, S.y); setPos(c.x, c.y);
    });

    init();
})();
</script>
</body>
</html>
